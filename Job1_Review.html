["Ahn, Keun", "Angotti, Sylvia", "Austria, Joseph", "Biggs, Tyrell", "Calidas, Riddhi", "Campbell, Scott", "Carr, Lynette", "Chiaravalloti, Michael", "Connelly, Tiffany", "Corcoran, Kevin", "Daniels, Torrence", "DeLeon, Marco", "Delmonico, Marisa", "Dennehy, Sheri", "Doughty, Chelsea", "Dwyer, Kevin", "Esposito, John", "Ferrante-Martin, Elena", "Fisk, Mary Pat", "Gerlach, Reese", "Gettler, Mary", "Gioni, Christopher", "Granieri, William", "Guy, Libbie", "Hampson, Elizabeth", "Harris, Megan", "Hartmann, Katy", "Janeczko, Douglas", "Judge, Michelle", "Junis, Thomas", "Kilduff, Kevin", "Konopelski, Louis", "Kozak, Bernadette", "Langan, John", "Laracy, John", "Lomascolo, Frank", "Lopez, Enrique", "Martino, Brianna", "Mazella, Julie", "McConnell, George", "McManus, Brianna", "Montegari, James", "Muscat, Nicole", "Nepolitan, John", "Nobilione, Lauren", "O'Connor, Paul", "Oh, Burton", "Ojo, Clement", "Payne, Jamie", "Quast, Richard", "Ramirez, Jaime", "Sabella, Daniel", "Saggio, Jack", "Serra, Carmine", "Stoller, Timothy", "TBD Theology, New", "Tranate, John", "Tuesta, David", "Umbrino, Philip", "Willi, Mary", "Winters, Jack", "Zawacki, Richard", "Zawiski, Brian"].forEach(function(t){var o=document.createElement("option");o.textContent=t;o.value=t;fTe.appendChild(o);});
var sortCol="step",sortDir=1;
function bd(p){return'<span class="badge b'+p+'">'+p+'</span>';}
function td2(t){return'<span class="tm tm'+t+'">'+t+'</span>';}
function esc(s){if(!s)return"";var d=document.createElement("span");d.textContent=s;return d.innerHTML;}
function render(data){
var cols=[{k:"step",l:"Step"},{k:"code",l:"Code"},{k:"title",l:"Title"},{k:"sec",l:"Sec"},{k:"dept",l:"Dept"},{k:"teacher",l:"Teacher"},{k:"room",l:"Room"},{k:"period",l:"Per"},{k:"term",l:"Term"},{k:"csTotal",l:"CS Total"},{k:"cap",l:"Cap"},{k:"cosched",l:"Co-Sched"},{k:"cohort",l:"Cohort"}];
document.getElementById("mH").innerHTML="<tr>"+cols.map(function(c){return'<th data-k="'+c.k+'">'+c.l+(sortCol===c.k?(sortDir>0?" &#9650;":" &#9660;"):"")+'</th>';}).join("")+"</tr>";
document.getElementById("mB").innerHTML=data.map(function(s){return"<tr><td>"+s.step+"</td><td class='cc'>"+s.code+"</td><td>"+esc(s.title)+"</td><td>"+s.sec+"</td><td>"+esc(s.dept)+"</td><td><a href='#' class='tl' data-t='"+esc(s.teacher)+"'>"+esc(s.teacher)+"</a></td><td>"+esc(s.room)+"</td><td>"+bd(s.period)+"</td><td>"+td2(s.term)+"</td><td style='text-align:right;font-variant-numeric:tabular-nums'>"+s.csTotal.toLocaleString()+"</td><td style='text-align:center'>"+s.cap+"</td><td>"+(s.cosched?'<span class="csg">'+esc(s.cosched)+"</span>":"")+"</td><td>"+(s.cohort?esc(s.cohort):"")+"</td></tr>";}).join("");
document.getElementById("fCnt").textContent=data.length+" / 371";}
function filt(){var d=S.slice(),vp=fP.value,vt=fT.value,vd=fD.value,vte=fTe.value,vs=fS.value.toLowerCase();
if(vp)d=d.filter(function(s){return s.period===vp;});if(vt)d=d.filter(function(s){return s.term===vt;});
if(vd)d=d.filter(function(s){return s.dept===vd;});if(vte)d=d.filter(function(s){return s.teacher===vte;});
if(vs)d=d.filter(function(s){return String(s.code).indexOf(vs)>=0||s.title.toLowerCase().indexOf(vs)>=0||s.room.toLowerCase().indexOf(vs)>=0||s.teacher.toLowerCase().indexOf(vs)>=0||(s.cosched&&s.cosched.toLowerCase().indexOf(vs)>=0);});
d.sort(function(a,b){var av=a[sortCol],bv=b[sortCol];if(typeof av==="string"){av=av.toLowerCase();bv=(bv||"").toLowerCase();}return av<bv?-sortDir:av>bv?sortDir:0;});return d;}
function apply(){render(filt());}
[fP,fT,fD,fTe].forEach(function(el){el.addEventListener("change",apply);});
fS.addEventListener("input",apply);
document.getElementById("mH").addEventListener("click",function(e){var th=e.target.closest("th");if(!th)return;var k=th.getAttribute("data-k");if(!k)return;if(sortCol===k)sortDir*=-1;else{sortCol=k;sortDir=1;}apply();});
function showT(name){var grid=document.getElementById("tg");var info=T.filter(function(t){return t.name===name;})[0];var secs=S.filter(function(s){return s.teacher===name;});
document.getElementById("tgT").textContent=name+(info?" (ID: "+info.tid+")":"");
if(info)document.getElementById("tgL").innerHTML="S1: <strong>"+info.s1+"/"+info.maxS1+"</strong> | S2: <strong>"+info.s2+"/"+info.maxS2+"</strong>";
var h="<thead><tr><th>Period</th><th>S1</th><th>S2</th></tr></thead><tbody>";
PS.forEach(function(p){var s1=secs.filter(function(s){return s.period===p&&(s.term==="FY"||s.term==="S1");});var s2=secs.filter(function(s){return s.period===p&&(s.term==="FY"||s.term==="S2");});
var s1t=s1.map(function(s){return s.code+" "+s.title+(s.cosched?" ["+s.cosched+"]":"");}).join("<br>")||"";
var s2t=s2.map(function(s){return s.code+" "+s.title+(s.cosched?" ["+s.cosched+"]":"");}).join("<br>")||"";
h+="<tr><td>"+bd(p)+"</td><td class='"+(s1t?"":"fr")+"'>"+(s1t||"FREE")+"</td><td class='"+(s2t?"":"fr")+"'>"+(s2t||"FREE")+"</td></tr>";});
h+="</tbody>";document.getElementById("tgTbl").innerHTML=h;grid.classList.add("vis");grid.scrollIntoView({behavior:"smooth",block:"nearest"});}
document.getElementById("tgX").addEventListener("click",function(){document.getElementById("tg").classList.remove("vis");});
document.addEventListener("click",function(e){var a=e.target.closest("a.tl");if(!a)return;e.preventDefault();showT(a.getAttribute("data-t"));});
var tabs={t1:"v1",t2:"v2",t3:"v3"};
function sw(id){Object.keys(tabs).forEach(function(tid){document.getElementById(tid).classList.toggle("on",tid===id);document.getElementById(tabs[tid]).style.display=tid===id?"":"none";});if(id==="t2")rPer();if(id==="t3")rTch();}
document.getElementById("t1").addEventListener("click",function(){sw("t1");});
document.getElementById("t2").addEventListener("click",function(){sw("t2");});
document.getElementById("t3").addEventListener("click",function(){sw("t3");});
function rPer(){document.getElementById("v2").innerHTML=PS.map(function(p){var secs=S.filter(function(s){return s.period===p;}).sort(function(a,b){return a.term.localeCompare(b.term)||String(a.code).localeCompare(String(b.code));});
return'<h3 style="margin:16px 0 6px;font-size:0.95rem">'+bd(p)+' Period '+p+' &#8212; '+secs.length+' sections</h3><div class="tw"><table><thead><tr><th>Code</th><th>Title</th><th>Sec</th><th>Term</th><th>Teacher</th><th>Room</th><th>Dept</th><th>Co-Sched</th></tr></thead><tbody>'+secs.map(function(s){return"<tr><td class='cc'>"+s.code+"</td><td>"+esc(s.title)+"</td><td>"+s.sec+"</td><td>"+td2(s.term)+"</td><td><a href='#' class='tl' data-t='"+esc(s.teacher)+"'>"+esc(s.teacher)+"</a></td><td>"+esc(s.room)+"</td><td>"+esc(s.dept)+"</td><td>"+(s.cosched?'<span class="csg">'+esc(s.cosched)+"</span>":"")+"</td></tr>";}).join("")+"</tbody></table></div>";}).join("");}
function rTch(){document.getElementById("tH").innerHTML="<tr><th>Teacher</th><th>ID</th><th>S1</th><th>S2</th><th>Max S1</th><th>Max S2</th><th>Status</th></tr>";
document.getElementById("tB").innerHTML=T.slice().sort(function(a,b){return a.name.localeCompare(b.name);}).map(function(t){var over=t.s1>t.maxS1||t.s2>t.maxS2,atCap=t.s1===t.maxS1&&t.s2===t.maxS2;
var st=over?"&#9888; OVER":atCap?"At Cap":"OK";var cl=over?"color:#C0392B":atCap?"color:#C47F17":"color:#2E8B57";
return"<tr><td><a href='#' class='tl' data-t='"+esc(t.name)+"'>"+esc(t.name)+"</a></td><td class='cc'>"+(t.tid||"")+"</td><td style='text-align:center'>"+t.s1+"</td><td style='text-align:center'>"+t.s2+"</td><td style='text-align:center'>"+t.maxS1+"</td><td style='text-align:center'>"+t.maxS2+"</td><td style='"+cl+";font-weight:600;font-size:0.78rem'>"+st+"</td></tr>";}).join("");}
apply();
</script>
