<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Don Bosco Preparatory High School — Module 01</title>
<style>
/* ================================================================
   TOKEN SYSTEM
   ================================================================ */
:root {
  --ink: #1B2838;
  --ink2: #3D4F63;
  --ink3: #6B7B8D;
  --paper: #F8F7F3;
  --paper2: #FFFFFF;
  --paper3: #F0EEE8;
  --chalk: #FDFCF9;
  --slate: #E5E2DB;
  --slate2: #CBC7BD;
  --blue: #2D5FA6;
  --blue-light: #E8EFF8;
  --blue-dark: #1E4175;
  --fern: #2E8B57;
  --fern-bg: #EAF5EF;
  --fern-text: #1A5C38;
  --amber: #C49026;
  --amber-bg: #FDF5E6;
  --amber-text: #7A5A18;
  --brick: #C0392B;
  --brick-bg: #FBEAE8;
  --brick-text: #7A241A;
  --ash: #F0EEE8;
  --ash-text: #6B7B8D;
  --mauve: #6C5B8A;
  --mauve-bg: #F0ECF5;
  --dupe-bg: #E8EFF8;
  --dupe-text: #2D5FA6;
  --credit-bg: #FEF0E4;
  --credit-text: #8B5E2A;
  --radius: 3px;
  --shadow: 0 1px 2px rgba(27,40,56,.08);
  --shadow-md: 0 4px 16px rgba(27,40,56,.12);
  --header-h: 52px;
  --tab-h: 38px;
  --row-alt: rgba(27,40,56,.02);
  --focus-ring: 0 0 0 2px var(--blue-light), 0 0 0 3px var(--blue);
}

@media (prefers-color-scheme: dark) {
  :root {
    --ink: #E0DFD8;
    --ink2: #A8A49A;
    --ink3: #7A766C;
    --paper: #1A1D23;
    --paper2: #22262E;
    --paper3: #282C35;
    --chalk: #2A2E37;
    --slate: #353840;
    --slate2: #44484F;
    --blue: #6B9FE0;
    --blue-light: #1E2A3D;
    --blue-dark: #9BC0F0;
    --fern: #5CB882;
    --fern-bg: #1A2E23;
    --fern-text: #7ED4A0;
    --amber: #E0B04A;
    --amber-bg: #2E2618;
    --amber-text: #E8C66A;
    --brick: #E06050;
    --brick-bg: #2E1A18;
    --brick-text: #F0908A;
    --ash: #2A2E37;
    --ash-text: #7A766C;
    --mauve: #A08CC0;
    --mauve-bg: #27222E;
    --dupe-bg: #1E2A3D;
    --dupe-text: #6B9FE0;
    --credit-bg: #2E2618;
    --credit-text: #E0B04A;
    --shadow: 0 1px 3px rgba(0,0,0,.3);
    --shadow-md: 0 4px 16px rgba(0,0,0,.4);
    --row-alt: rgba(255,255,255,.02);
  }
}
:root[data-theme="dark"] {
  --ink: #E0DFD8;
  --ink2: #A8A49A;
  --ink3: #7A766C;
  --paper: #1A1D23;
  --paper2: #22262E;
  --paper3: #282C35;
  --chalk: #2A2E37;
  --slate: #353840;
  --slate2: #44484F;
  --blue: #6B9FE0;
  --blue-light: #1E2A3D;
  --blue-dark: #9BC0F0;
  --fern: #5CB882;
  --fern-bg: #1A2E23;
  --fern-text: #7ED4A0;
  --amber: #E0B04A;
  --amber-bg: #2E2618;
  --amber-text: #E8C66A;
  --brick: #E06050;
  --brick-bg: #2E1A18;
  --brick-text: #F0908A;
  --ash: #2A2E37;
  --ash-text: #7A766C;
  --mauve: #A08CC0;
  --mauve-bg: #27222E;
  --dupe-bg: #1E2A3D;
  --dupe-text: #6B9FE0;
  --credit-bg: #2E2618;
  --credit-text: #E0B04A;
  --shadow: 0 1px 3px rgba(0,0,0,.3);
  --shadow-md: 0 4px 16px rgba(0,0,0,.4);
  --row-alt: rgba(255,255,255,.02);
}
:root[data-theme="light"] {
  --ink: #1B2838;
  --ink2: #3D4F63;
  --ink3: #6B7B8D;
  --paper: #F8F7F3;
  --paper2: #FFFFFF;
  --paper3: #F0EEE8;
  --chalk: #FDFCF9;
  --slate: #E5E2DB;
  --slate2: #CBC7BD;
  --blue: #2D5FA6;
  --blue-light: #E8EFF8;
  --blue-dark: #1E4175;
  --fern: #2E8B57;
  --fern-bg: #EAF5EF;
  --fern-text: #1A5C38;
  --amber: #C49026;
  --amber-bg: #FDF5E6;
  --amber-text: #7A5A18;
  --brick: #C0392B;
  --brick-bg: #FBEAE8;
  --brick-text: #7A241A;
  --ash: #F0EEE8;
  --ash-text: #6B7B8D;
  --mauve: #6C5B8A;
  --mauve-bg: #F0ECF5;
  --dupe-bg: #E8EFF8;
  --dupe-text: #2D5FA6;
  --credit-bg: #FEF0E4;
  --credit-text: #8B5E2A;
  --shadow: 0 1px 2px rgba(27,40,56,.08);
  --shadow-md: 0 4px 16px rgba(27,40,56,.12);
  --row-alt: rgba(27,40,56,.02);
}

/* ================================================================
   RESET & BASE
   ================================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  background: var(--paper);
  color: var(--ink);
  font-size: 13px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}

/* ================================================================
   HEADER — institutional nameplate
   ================================================================ */
.app-header {
  height: var(--header-h);
  background: var(--paper2);
  border-bottom: 1px solid var(--slate);
  display: flex;
  align-items: center;
  padding: 0 28px;
  gap: 16px;
  flex-shrink: 0;
}
.app-brand {
  display: flex;
  align-items: baseline;
  gap: 10px;
}
.app-title {
  font-family: Georgia, 'Times New Roman', 'Noto Serif', serif;
  font-size: 17px;
  font-weight: 700;
  color: var(--ink);
  letter-spacing: -0.02em;
}
.app-sep {
  width: 1px;
  height: 18px;
  background: var(--slate2);
  align-self: center;
}
.app-subtitle {
  font-size: 11px;
  font-weight: 500;
  color: var(--ink3);
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.header-actions {
  margin-left: auto;
  display: flex;
  gap: 6px;
  align-items: center;
}

/* ================================================================
   BUTTONS
   ================================================================ */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 5px 13px;
  border-radius: var(--radius);
  font-size: 12px;
  font-weight: 550;
  cursor: pointer;
  border: 1px solid var(--slate);
  background: var(--paper2);
  color: var(--ink2);
  transition: background .12s, border-color .12s;
  line-height: 1.4;
}
.btn:hover { background: var(--paper3); border-color: var(--slate2); }
.btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.btn-primary { background: var(--blue); color: #fff; border-color: var(--blue); }
.btn-primary:hover { background: var(--blue-dark); border-color: var(--blue-dark); }
.btn-success { background: var(--fern); color: #fff; border-color: var(--fern); }
.btn-success:hover { opacity: .9; }
.btn-danger { background: var(--brick); color: #fff; border-color: var(--brick); }
.btn-danger:hover { opacity: .9; }
.btn-sm { padding: 3px 9px; font-size: 11px; }
.btn-icon {
  width: 28px; height: 28px; padding: 0;
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: var(--radius);
}

/* ================================================================
   TABS — folder-tab metaphor
   ================================================================ */
.tab-bar {
  height: var(--tab-h);
  background: var(--paper2);
  border-bottom: 1px solid var(--slate);
  display: flex;
  align-items: flex-end;
  padding: 0 28px;
  gap: 1px;
  flex-shrink: 0;
  overflow-x: auto;
  scrollbar-width: none;
}
.tab-bar::-webkit-scrollbar { display: none; }
.tab {
  padding: 7px 15px 6px;
  font-size: 12px;
  font-weight: 500;
  color: var(--ink3);
  cursor: pointer;
  border: 1px solid transparent;
  border-bottom: none;
  border-radius: 3px 3px 0 0;
  margin-bottom: -1px;
  white-space: nowrap;
  transition: all .12s;
  display: flex;
  align-items: center;
  gap: 6px;
  background: transparent;
  position: relative;
}
.tab:hover { color: var(--ink2); background: var(--paper3); }
.tab.active {
  color: var(--blue);
  background: var(--paper);
  border-color: var(--slate);
  font-weight: 600;
  z-index: 1;
}
.tab .badge {
  font-size: 10px;
  padding: 0 5px;
  border-radius: 8px;
  font-weight: 700;
  line-height: 16px;
  min-width: 16px;
  text-align: center;
  font-variant-numeric: tabular-nums;
}
.badge-red { background: var(--brick-bg); color: var(--brick-text); }
.badge-green { background: var(--fern-bg); color: var(--fern-text); }
.badge-yellow { background: var(--amber-bg); color: var(--amber-text); }
.badge-gray { background: var(--ash); color: var(--ash-text); }

/* ================================================================
   LAYOUT
   ================================================================ */
.app-layout {
  display: flex;
  flex-direction: column;
  height: 100%;
}
.content-area {
  flex: 1;
  overflow: auto;
  padding: 20px 28px 28px;
}
.sheet-panel { display: none; }
.sheet-panel.active { display: block; }

/* ================================================================
   STAT STRIP — compact summary with severity borders
   ================================================================ */
.stats-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.stat-card {
  background: var(--paper2);
  border: 1px solid var(--slate);
  border-left: 3px solid var(--slate2);
  border-radius: var(--radius);
  padding: 10px 16px;
  min-width: 120px;
  display: flex;
  flex-direction: column;
}
.stat-card.stat-green { border-left-color: var(--fern); }
.stat-card.stat-yellow { border-left-color: var(--amber); }
.stat-card.stat-red { border-left-color: var(--brick); }
.stat-card.stat-blue { border-left-color: var(--blue); }
.stat-label {
  font-size: 10px;
  font-weight: 600;
  color: var(--ink3);
  letter-spacing: 0.05em;
  text-transform: uppercase;
  margin-bottom: 2px;
}
.stat-value {
  font-size: 20px;
  font-weight: 700;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
  line-height: 1.2;
}
.stat-value.green { color: var(--fern); }
.stat-value.yellow { color: var(--amber); }
.stat-value.red { color: var(--brick); }

/* ================================================================
   TOOLBAR
   ================================================================ */
.toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}
.toolbar input, .toolbar select {
  padding: 5px 10px;
  border: 1px solid var(--slate);
  border-radius: var(--radius);
  font-size: 12px;
  background: var(--paper2);
  color: var(--ink);
  line-height: 1.4;
}
.toolbar input:focus, .toolbar select:focus {
  outline: none;
  box-shadow: var(--focus-ring);
}
.toolbar input { min-width: 180px; }

/* ================================================================
   TABLES — administrative form gridlines
   ================================================================ */
.ws-table-wrap {
  overflow-x: auto;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  border: 1px solid var(--slate);
  margin-bottom: 14px;
  background: var(--paper2);
}
.ws-table {
  width: 100%;
  border-collapse: collapse;
  font-variant-numeric: tabular-nums;
}
.ws-table th {
  background: var(--paper3);
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--ink2);
  padding: 7px 10px;
  text-align: left;
  border-bottom: 2px solid var(--slate);
  position: sticky;
  top: 0;
  z-index: 2;
  white-space: nowrap;
}
.ws-table td {
  padding: 5px 10px;
  border-bottom: 1px solid var(--slate);
  font-size: 12.5px;
  vertical-align: middle;
  line-height: 1.5;
}
.ws-table tbody tr:nth-child(even):not(.row-spacer):not(.row-total) td {
  background: var(--row-alt);
}
.ws-table tbody tr:hover:not(.row-spacer):not(.row-total) td {
  background: var(--blue-light);
}
.ws-table tr:last-child td { border-bottom: none; }

.row-spacer td {
  height: 8px;
  background: var(--paper) !important;
  border: none !important;
  padding: 0 !important;
}
.row-total td {
  font-weight: 700;
  font-size: 12.5px;
  border-top: 2px solid var(--slate2) !important;
  border-bottom: 2px solid var(--slate2) !important;
  background: var(--paper3) !important;
}

/* Credit highlighting */
.credit-yellow { background: var(--amber-bg) !important; color: var(--amber-text); font-weight: 700; }
.credit-green { background: var(--fern-bg) !important; color: var(--fern-text); font-weight: 700; }
.credit-red { background: var(--brick-bg) !important; color: var(--brick-text); font-weight: 700; }

/* Prerequisite pills */
.prereq-green {
  background: var(--fern-bg); color: var(--fern-text);
  padding: 1px 7px; border-radius: 2px; font-size: 11px;
  font-weight: 600; display: inline-block;
}
.prereq-red {
  background: var(--brick-bg); color: var(--brick-text);
  padding: 1px 7px; border-radius: 2px; font-size: 11px;
  font-weight: 600; display: inline-block;
}
.prereq-gray {
  background: var(--ash); color: var(--ash-text);
  padding: 1px 7px; border-radius: 2px; font-size: 11px;
  font-weight: 600; display: inline-block;
}

/* Flag tags */
.flag-tag {
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 2px;
  font-weight: 700;
  display: inline-block;
  margin: 1px 2px;
  letter-spacing: 0.01em;
  line-height: 1.5;
}
.flag-prereq { background: var(--brick-bg); color: var(--brick-text); }
.flag-transcript { background: var(--amber-bg); color: var(--amber-text); }
.flag-unknown { background: var(--mauve-bg); color: var(--mauve); }
.flag-duplicate { background: var(--dupe-bg); color: var(--dupe-text); }
.flag-credit { background: var(--credit-bg); color: var(--credit-text); }

/* Student name in master */
.stu-name { font-weight: 600; }
.stu-id { font-family: 'SF Mono', 'Cascadia Code', 'Consolas', monospace; font-size: 11px; color: var(--ink3); }

/* ================================================================
   TALLY TABLE
   ================================================================ */
.tally-table th { text-align: center; }
.tally-table td { text-align: center; }
.tally-table td:first-child, .tally-table th:first-child,
.tally-table td:nth-child(2), .tally-table th:nth-child(2),
.tally-table td:nth-child(3), .tally-table th:nth-child(3) { text-align: left; }
.tally-count { font-weight: 700; font-size: 13px; }
.tally-zero { color: var(--ink3); font-weight: 400; }
.tally-dept-row td {
  background: var(--paper3) !important;
  font-weight: 700;
  font-size: 11px;
  color: var(--ink2);
  letter-spacing: 0.02em;
  border-bottom: 1px solid var(--slate) !important;
}

/* ================================================================
   VALIDATION PANEL
   ================================================================ */
.validation-panel {
  background: var(--paper2);
  border: 1px solid var(--slate);
  border-radius: var(--radius);
  padding: 14px 18px;
  margin-bottom: 16px;
}
.validation-panel h3 {
  font-family: Georgia, 'Times New Roman', serif;
  font-size: 15px;
  font-weight: 700;
  margin-bottom: 6px;
}
.validation-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 0;
  font-size: 12.5px;
  border-bottom: 1px solid var(--slate);
}
.validation-item:last-child { border-bottom: none; }
.val-pass { color: var(--fern); }
.val-fail { color: var(--brick); }
.val-icon { font-size: 15px; width: 18px; text-align: center; flex-shrink: 0; }

/* ================================================================
   MODALS
   ================================================================ */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(27,40,56,.5);
  z-index: 1000;
  align-items: center;
  justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--paper2);
  border-radius: 6px;
  box-shadow: var(--shadow-md);
  width: 520px;
  max-width: 94vw;
  max-height: 88vh;
  overflow-y: auto;
  border: 1px solid var(--slate);
}
.modal-header {
  padding: 14px 20px;
  border-bottom: 1px solid var(--slate);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.modal-header h3 {
  font-family: Georgia, 'Times New Roman', serif;
  font-size: 15px;
  font-weight: 700;
  color: var(--ink);
}
.modal-close {
  background: none;
  border: none;
  font-size: 18px;
  cursor: pointer;
  color: var(--ink3);
  padding: 2px 6px;
  border-radius: var(--radius);
  line-height: 1;
}
.modal-close:hover { background: var(--paper3); }
.modal-body { padding: 18px 20px; }
.form-group { margin-bottom: 12px; }
.form-group label {
  display: block;
  font-size: 11px;
  font-weight: 600;
  color: var(--ink2);
  margin-bottom: 3px;
  letter-spacing: 0.02em;
}
.form-group input, .form-group select {
  width: 100%;
  padding: 7px 10px;
  border: 1px solid var(--slate);
  border-radius: var(--radius);
  font-size: 13px;
  background: var(--paper2);
  color: var(--ink);
}
.form-group input:focus, .form-group select:focus {
  outline: none;
  box-shadow: var(--focus-ring);
}
.form-row { display: flex; gap: 12px; }
.form-row .form-group { flex: 1; }
.modal-footer {
  padding: 10px 20px;
  border-top: 1px solid var(--slate);
  display: flex;
  justify-content: flex-end;
  gap: 6px;
}

/* ================================================================
   STATUS BAR
   ================================================================ */
.status-bar {
  height: 26px;
  background: var(--paper3);
  border-top: 1px solid var(--slate);
  display: flex;
  align-items: center;
  padding: 0 28px;
  gap: 18px;
  font-size: 11px;
  color: var(--ink3);
  flex-shrink: 0;
  font-variant-numeric: tabular-nums;
}

/* ================================================================
   PRINT
   ================================================================ */
@media print {
  .app-header, .tab-bar, .toolbar, .status-bar, .btn, .header-actions { display: none !important; }
  .content-area { overflow: visible; padding: 10px; }
  .sheet-panel { display: block !important; page-break-after: always; }
  .ws-table-wrap { box-shadow: none; border: 1px solid #999; }
  .ws-table { font-size: 10px; }
  .ws-table th { background: #eee !important; }
  .credit-yellow, .credit-green, .credit-red,
  .prereq-green, .prereq-red, .prereq-gray,
  .flag-prereq, .flag-transcript, .flag-unknown, .flag-duplicate, .flag-credit {
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; }
}
</style>
</head>
<body>
<div class="app-layout">

  <!-- Header -->
  <div class="app-header">
    <div class="app-brand">
      <div class="app-title">Don Bosco Preparatory High School</div>
      <div class="app-sep"></div>
      <div class="app-subtitle">Module 01 &middot; Course Request Workbook</div>
    </div>
    <div class="header-actions">
      <label class="btn btn-primary" style="cursor:pointer">
        Import Data
        <input type="file" accept=".csv,.txt" onchange="handleFileImport(event)" style="display:none">
      </label>
      <button class="btn" onclick="exportCSV()">Export CSV</button>
      <button class="btn" onclick="printWorkbook()">Print</button>
      <button class="btn" onclick="openAddStudent()">+ Student</button>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tab-bar" id="tabBar">
    <div class="tab active" data-sheet="master" onclick="switchTab(this)">Master Worksheet</div>
    <div class="tab" data-sheet="tally" onclick="switchTab(this)">Course Tally</div>
    <div class="tab" data-sheet="review" onclick="switchTab(this)">Manual Review <span class="badge badge-red" id="reviewBadge">0</span></div>
    <div class="tab" data-sheet="grade9" onclick="switchTab(this)">Grade 9 <span class="badge badge-gray" id="g9Badge">0</span></div>
    <div class="tab" data-sheet="grade10" onclick="switchTab(this)">Grade 10 <span class="badge badge-gray" id="g10Badge">0</span></div>
    <div class="tab" data-sheet="grade11" onclick="switchTab(this)">Grade 11 <span class="badge badge-gray" id="g11Badge">0</span></div>
    <div class="tab" data-sheet="grade12" onclick="switchTab(this)">Grade 12 <span class="badge badge-gray" id="g12Badge">0</span></div>
  </div>

  <!-- Content Area -->
  <div class="content-area">

    <!-- MASTER WORKSHEET -->
    <div class="sheet-panel active" id="sheet-master">
      <div class="stats-bar" id="masterStats"></div>
      <div class="toolbar">
        <input type="text" id="masterSearch" placeholder="Search students..." oninput="renderMaster()">
        <select id="masterFilter" onchange="renderMaster()">
          <option value="all">All Students</option>
          <option value="under">Under 35 Credits</option>
          <option value="exact">Exactly 35 Credits</option>

const GRADE_ORDER = ['A+','A','A-','B+','B','B-','C+','C','C-','D+','D','D-','F'];
function gradeToNum(g) {
  if (!g) return -1;
  const s = String(g).trim().toUpperCase();
  const idx = GRADE_ORDER.indexOf(s);
  if (idx !== -1) return 12 - idx;
  const n = parseFloat(s);
  if (!isNaN(n)) {
    if (n >= 93) return 12; if (n >= 90) return 11; if (n >= 87) return 10;
    if (n >= 83) return 9; if (n >= 80) return 8; if (n >= 77) return 7;
    if (n >= 73) return 6; if (n >= 70) return 5; if (n >= 67) return 4;
    if (n >= 63) return 3; if (n >= 60) return 2; if (n >= 57) return 1;
    return 0;
  }
  if (s === 'PASS' || s === 'P') return 5;
  if (s === 'FAIL' || s === 'NP') return 0;
  return -1;
}
function meetsPrereq(earned, required) {
  const e = gradeToNum(earned);
  const r = gradeToNum(required);
  if (e < 0) return 'unknown';
  return e >= r ? 'met' : 'below';
}

function getStudentFlags(studentId) {
  const stu = students.find(s => s.studentId === studentId);
  if (!stu) return [];
  const reqs = requests.filter(r => r.studentId === studentId);
  const flags = [];
  if (stu.transcript === 'no') flags.push({type:'transcript', msg:'Transcript missing'});
  const seen = {};
  reqs.forEach(r => {
    const course = COURSE_CATALOG.find(c => c.id === r.courseId);
    if (!course) { flags.push({type:'unknown', msg:'Unknown course: '+r.courseId, courseId:r.courseId, rid:r.rid}); return; }
    const key = r.courseId + '_' + r.semester;
    if (seen[key]) flags.push({type:'duplicate', msg:'Duplicate: '+course.name+' ('+r.semester+')', courseId:r.courseId, rid:r.rid});
    seen[key] = true;
    if (course.prereq && course.prereqGrade) {
      if (!r.prereqGrade) flags.push({type:'prereq', msg:'Prereq grade missing for '+course.name, courseId:r.courseId, rid:r.rid});
      else { const s = meetsPrereq(r.prereqGrade, course.prereqGrade); if (s==='below') flags.push({type:'prereq', msg:'Below prereq for '+course.name+': earned '+r.prereqGrade+', needs '+course.prereqGrade, courseId:r.courseId, rid:r.rid}); }
    }
  });
  const tc = calcCredits(reqs);
  if (tc > 35) flags.push({type:'credit', msg:'Over 35 credits ('+tc+')'});
  return flags;
}

function calcCredits(reqs) {
  return reqs.reduce((s, r) => { const c = COURSE_CATALOG.find(x => x.id === r.courseId); return s + (c ? c.credits : 0); }, 0);
}
function creditClass(t) { if (t < 35) return 'credit-yellow'; if (t === 35) return 'credit-green'; return 'credit-red'; }

function wrapTable(html) { return '<div class="ws-table-wrap">' + html + '</div>'; }

function renderMaster() {
  const search = (document.getElementById('masterSearch').value || '').toLowerCase();
  const filter = document.getElementById('masterFilter').value;
  let stuList = [...students].sort((a,b) => a.last.localeCompare(b.last) || a.first.localeCompare(b.first));
  if (search) stuList = stuList.filter(s => (s.last+' '+s.first+' '+s.studentId).toLowerCase().includes(search));
  if (filter !== 'all') {
    stuList = stuList.filter(s => {
      const reqs = requests.filter(r => r.studentId === s.studentId);
      const cr = calcCredits(reqs);
      const fl = getStudentFlags(s.studentId);
      if (filter==='under') return cr < 35;
      if (filter==='exact') return cr === 35;
      if (filter==='over') return cr > 35;
      if (filter==='flagged') return fl.length > 0;
      return true;
    });
  }

  const totalCreditsAll = students.map(s => calcCredits(requests.filter(r => r.studentId === s.studentId)));
  const under = totalCreditsAll.filter(c => c < 35).length;
  const exact = totalCreditsAll.filter(c => c === 35).length;
  const over = totalCreditsAll.filter(c => c > 35).length;
  const allFlags = students.flatMap(s => getStudentFlags(s.studentId));

  document.getElementById('masterStats').innerHTML =
    '<div class="stat-card stat-blue"><div class="stat-label">Students</div><div class="stat-value">'+students.length+'</div></div>'+
    '<div class="stat-card"><div class="stat-label">Requests</div><div class="stat-value">'+requests.length+'</div></div>'+
    '<div class="stat-card stat-yellow"><div class="stat-label">Under 35 Cr</div><div class="stat-value yellow">'+under+'</div></div>'+
    '<div class="stat-card stat-green"><div class="stat-label">At 35 Cr</div><div class="stat-value green">'+exact+'</div></div>'+
    '<div class="stat-card stat-red"><div class="stat-label">Over 35 Cr</div><div class="stat-value red">'+over+'</div></div>'+
    '<div class="stat-card'+(allFlags.length?' stat-red':'')+'"><div class="stat-label">Flags</div><div class="stat-value'+(allFlags.length?' red':'')+'">'+allFlags.length+'</div></div>';

  let html = '<table class="ws-table"><thead><tr>'+
    '<th>ID</th><th>Student</th><th>Gr</th><th>Course</th>'+
    '<th>Course Name</th><th>Dept</th><th>Cr</th><th>Sem</th>'+
    '<th>Per</th><th>Prerequisite</th><th>Prereq Grade</th><th>Flags</th><th></th>'+
    '</tr></thead><tbody>';

  stuList.forEach(s => {
    const stuReqs = requests.filter(r => r.studentId === s.studentId)
      .sort((a,b) => { const ca=COURSE_CATALOG.find(x=>x.id===a.courseId), cb=COURSE_CATALOG.find(x=>x.id===b.courseId); return ((ca?.dept||'')+(ca?.name||'')).localeCompare((cb?.dept||'')+(cb?.name||'')); });
    const totalCredits = calcCredits(stuReqs);
    const stuFlags = getStudentFlags(s.studentId);

    stuReqs.forEach((r, i) => {
      const course = COURSE_CATALOG.find(c => c.id === r.courseId);
      const cName = course ? course.name : r.courseId;
      const dept = course ? course.dept : '?';
      const cr = course ? course.credits : 0;
      const prereqName = course && course.prereq ? (COURSE_CATALOG.find(c=>c.id===course.prereq)?.name || course.prereq) : '';
      let prereqDisplay = '';
      if (course && course.prereq && course.prereqGrade) {
        if (!r.prereqGrade) prereqDisplay = '<span class="prereq-gray">Not provided</span>';
        else { const st = meetsPrereq(r.prereqGrade, course.prereqGrade); if (st==='met') prereqDisplay='<span class="prereq-green">'+r.prereqGrade+' (min '+course.prereqGrade+')</span>'; else if (st==='below') prereqDisplay='<span class="prereq-red">'+r.prereqGrade+' (min '+course.prereqGrade+')</span>'; else prereqDisplay='<span class="prereq-gray">'+r.prereqGrade+' (?)</span>'; }
      }
      const rowFlags = stuFlags.filter(f => f.rid === r.rid);
      const flagHtml = rowFlags.map(f => '<span class="flag-tag flag-'+f.type+'">'+f.msg+'</span>').join(' ');

      html += '<tr>'+

        '<td>'+(i===0?s.grade:'')+'</td>'+
        '<td><span class="stu-id">'+r.courseId+'</span></td>'+
        '<td>'+cName+'</td><td>'+dept+'</td><td>'+cr+'</td>'+
        '<td>'+r.semester+'</td><td>'+(r.period||'')+'</td>'+
        '<td style="font-size:11px">'+prereqName+'</td>'+
        '<td>'+prereqDisplay+'</td>'+
        '<td>'+flagHtml+'</td>'+
        '<td><button class="btn btn-sm btn-icon" onclick="deleteRequest('+r.rid+')" title="Remove" style="color:var(--brick);border-color:transparent;background:transparent">&times;</button></td>'+

    });

    const ccls = creditClass(totalCredits);
    html += '<tr class="row-total"><td></td><td></td><td></td><td></td>'+
      '<td style="text-align:right"><strong>Total Credits</strong></td>'+
      '<td class="'+ccls+'" colspan="2"><strong>'+totalCredits+'</strong></td>'+
      '<td colspan="6">'+stuFlags.filter(f=>!f.rid).map(f=>'<span class="flag-tag flag-'+f.type+'">'+f.msg+'</span>').join(' ')+'</td></tr>';
    html += '<tr class="row-spacer"><td colspan="13"></td></tr><tr class="row-spacer"><td colspan="13"></td></tr>';
  });

  html += '</tbody></table>';
  document.getElementById('masterTable').innerHTML = wrapTable(html);
  updateStatusBar();
  updateBadges();
}

function renderTally() {
  const search = (document.getElementById('tallySearch').value || '').toLowerCase();

  const depts = [...new Set(COURSE_CATALOG.map(c=>c.dept))].sort();
  const deptSelect = document.getElementById('tallyDeptFilter');
  if (deptSelect.options.length <= 1) depts.forEach(d => { const o=document.createElement('option'); o.value=d; o.textContent=d; deptSelect.appendChild(o); });

  const tally = {};
  COURSE_CATALOG.forEach(c => { tally[c.id] = {course:c, g9:0, g10:0, g11:0, g12:0, total:0}; });
  requests.forEach(r => { if (!tally[r.courseId]) return; const stu=students.find(s=>s.studentId===r.studentId); if (!stu) return; tally[r.courseId]['g'+stu.grade]++; tally[r.courseId].total++; });

  let courses = Object.values(tally).filter(t => {
    if (deptFilter!=='all' && t.course.dept!==deptFilter) return false;

    return true;
  }).sort((a,b) => a.course.dept.localeCompare(b.course.dept) || a.course.name.localeCompare(b.course.name));

  const totalReqs = Object.values(tally).reduce((s,t)=>s+t.total,0);

  document.getElementById('tallyStats').innerHTML =

      currentDept = t.course.dept;
      html += '<tr class="tally-dept-row"><td colspan="9">'+currentDept+'</td></tr>';
    }
    const countCell = (v) => v ? '<span class="tally-count">'+v+'</span>' : '<span class="tally-zero">&mdash;</span>';

  html += '</tbody></table>';
  document.getElementById('tallyTable').innerHTML = wrapTable(html);

      '<td><span class="flag-tag flag-'+i.flag.type+'">'+i.flag.type.charAt(0).toUpperCase()+i.flag.type.slice(1)+'</span></td>'+
      '<td>'+i.flag.msg+'</td><td>'+courseName+'</td>'+
      '<td style="font-size:11px;color:var(--ink3)">'+action+'</td></tr>';
  });
  html += '</tbody></table>';
  document.getElementById('reviewTable').innerHTML = wrapTable(html);
}

function renderGrade(grade, search) {
  search = (search || '').toLowerCase();
  let stuList = students.filter(s => parseInt(s.grade)===grade).sort((a,b) => a.last.localeCompare(b.last)||a.first.localeCompare(b.first));
  if (search) stuList = stuList.filter(s => (s.last+' '+s.first+' '+s.studentId).toLowerCase().includes(search));

  const totalStu = students.filter(s => parseInt(s.grade)===grade).length;
  const totalReqs = requests.filter(r => { const s=students.find(x=>x.studentId===r.studentId); return s && parseInt(s.grade)===grade; }).length;
  const flagged = students.filter(s => parseInt(s.grade)===grade && getStudentFlags(s.studentId).length>0).length;

  document.getElementById('g'+grade+'Stats').innerHTML =
    '<div class="stat-card stat-blue"><div class="stat-label">Grade '+grade+' Students</div><div class="stat-value">'+totalStu+'</div></div>'+
    '<div class="stat-card"><div class="stat-label">Requests</div><div class="stat-value">'+totalReqs+'</div></div>'+
    '<div class="stat-card'+(flagged?' stat-red':'')+'"><div class="stat-label">Issues</div><div class="stat-value'+(flagged?' red':'')+'">'+flagged+'</div></div>';

  let html = '<table class="ws-table"><thead><tr>'+
    '<th>ID</th><th>Student</th><th>Counselor</th><th>Course</th>'+
    '<th>Course Name</th><th>Cr</th><th>Sem</th><th>Prereq Grade</th><th>Status</th>'+
    '</tr></thead><tbody>';

  stuList.forEach(s => {
    const stuReqs = requests.filter(r => r.studentId===s.studentId)
      .sort((a,b) => { const ca=COURSE_CATALOG.find(x=>x.id===a.courseId), cb=COURSE_CATALOG.find(x=>x.id===b.courseId); return ((ca?.dept||'')+(ca?.name||'')).localeCompare((cb?.dept||'')+(cb?.name||'')); });
    const totalCredits = calcCredits(stuReqs);
    const stuFlags = getStudentFlags(s.studentId);

    stuReqs.forEach((r, i) => {
      const course = COURSE_CATALOG.find(c => c.id === r.courseId);
      const cName = course ? course.name : r.courseId;
      const cr = course ? course.credits : 0;
      let prereqDisplay = '';
      if (course && course.prereq && course.prereqGrade) {
        if (!r.prereqGrade) prereqDisplay = '<span class="prereq-gray">&mdash;</span>';
        else { const st=meetsPrereq(r.prereqGrade,course.prereqGrade); if (st==='met') prereqDisplay='<span class="prereq-green">'+r.prereqGrade+'</span>'; else if (st==='below') prereqDisplay='<span class="prereq-red">'+r.prereqGrade+'</span>'; else prereqDisplay='<span class="prereq-gray">'+r.prereqGrade+'</span>'; }
      }
      const rowFlags = stuFlags.filter(f => f.rid === r.rid);
      const statusHtml = rowFlags.length
        ? rowFlags.map(f => '<span class="flag-tag flag-'+f.type+'">'+f.type+'</span>').join(' ')
        : '<span style="color:var(--fern);font-size:11px;font-weight:600">OK</span>';

      html += '<tr><td>'+(i===0?'<span class="stu-id">'+s.studentId+'</span>':'')+'</td>'+
        '<td>'+(i===0?'<span class="stu-name">'+s.last+', '+s.first+'</span>':'')+'</td>'+
        '<td>'+(i===0?s.counselor:'')+'</td>'+
        '<td><span class="stu-id">'+r.courseId+'</span></td>'+
        '<td>'+cName+'</td><td>'+cr+'</td><td>'+r.semester+'</td>'+
        '<td>'+prereqDisplay+'</td><td>'+statusHtml+'</td></tr>';
    });

    const ccls = creditClass(totalCredits);
    html += '<tr class="row-total"><td></td><td></td><td></td><td></td>'+
      '<td style="text-align:right"><strong>Total Credits</strong></td>'+
      '<td class="'+ccls+'"><strong>'+totalCredits+'</strong></td><td colspan="3"></td></tr>';
    html += '<tr class="row-spacer"><td colspan="9"></td></tr><tr class="row-spacer"><td colspan="9"></td></tr>';
  });
  html += '</tbody></table>';
  document.getElementById('grade'+grade+'Table').innerHTML = wrapTable(html);
}

function switchTab(el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.sheet-panel').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  const sheet = el.dataset.sheet;
  document.getElementById('sheet-' + sheet).classList.add('active');
  if (sheet === 'master') renderMaster();
  else if (sheet === 'tally') renderTally();
  else if (sheet === 'review') renderReview();
  else if (sheet === 'grade9') renderGrade(9);
  else if (sheet === 'grade10') renderGrade(10);
  else if (sheet === 'grade11') renderGrade(11);
  else if (sheet === 'grade12') renderGrade(12);
}

function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

function openAddStudent() {
  document.getElementById('sLast').value = '';
  document.getElementById('sFirst').value = '';
  document.getElementById('sId').value = String(nextStudentId);
  document.getElementById('sGrade').value = '9';
  document.getElementById('sCounselor').value = '';

function saveStudent() {
  const last=document.getElementById('sLast').value.trim(), first=document.getElementById('sFirst').value.trim();
  const id=document.getElementById('sId').value.trim(), grade=document.getElementById('sGrade').value;
  const counselor=document.getElementById('sCounselor').value.trim(), transcript=document.getElementById('sTranscript').value;

  if (students.find(s => s.studentId===id)) { alert('Student ID already exists.'); return; }
  students.push({studentId:id, last, first, grade:parseInt(grade), counselor, transcript});
  nextStudentId = Math.max(nextStudentId, parseInt(id)+1);
  saveState(); closeModal('studentModal'); renderAll();
}
function openAddCourse() {

function saveCourse() {
  const studentId=document.getElementById('cStudent').value, courseId=document.getElementById('cCourse').value;
  const semester=document.getElementById('cSemester').value, period=document.getElementById('cPeriod').value;
  const prereqGrade=document.getElementById('cPrereqGrade').value.trim(), notes=document.getElementById('cNotes').value.trim();
  if (!studentId||!courseId) { alert('Please select student and course.'); return; }
  requests.push({rid:nextRequestId++, studentId, courseId, semester, period, prereqGrade, notes});
  saveState(); closeModal('courseModal'); renderAll();
}
function deleteRequest(rid) { requests=requests.filter(r=>r.rid!==rid); saveState(); renderAll(); }

function runValidation() {
  const checks = [];
  checks.push({label:'All students have at least 1 course request',
    pass: students.every(s => requests.some(r => r.studentId === s.studentId))});
  const creditIssues = students.filter(s => calcCredits(requests.filter(r=>r.studentId===s.studentId)) !== 35);
  checks.push({label:'All students have exactly 35 credits', pass:creditIssues.length===0,
    detail: creditIssues.length ? creditIssues.length+' student(s) not at 35' : ''});
  const prereqIssues = [];
  requests.forEach(r => { const c=COURSE_CATALOG.find(x=>x.id===r.courseId); if (c&&c.prereq&&c.prereqGrade&&r.prereqGrade) { if (meetsPrereq(r.prereqGrade,c.prereqGrade)==='below') prereqIssues.push(r); }});
  checks.push({label:'All prerequisites are met', pass:prereqIssues.length===0, detail:prereqIssues.length?prereqIssues.length+' not met':''});
  const missingT = students.filter(s => s.transcript==='no');
  checks.push({label:'All transcripts available', pass:missingT.length===0, detail:missingT.length?missingT.length+' missing':''});
  const dupes = [];
  students.forEach(s => { const reqs=requests.filter(r=>r.studentId===s.studentId); const seen={}; reqs.forEach(r=>{const key=r.courseId+'_'+r.semester; if(seen[key])dupes.push(r); seen[key]=true;}); });
  checks.push({label:'No duplicate course requests', pass:dupes.length===0, detail:dupes.length?dupes.length+' duplicate(s)':''});
  const unknowns = requests.filter(r => !COURSE_CATALOG.find(c=>c.id===r.courseId));
  checks.push({label:'All course IDs are valid', pass:unknowns.length===0, detail:unknowns.length?unknowns.length+' unknown':''});
  checks.push({label:'Worksheet names are logical', pass:true});
  checks.push({label:'Professional formatting applied', pass:true});
  checks.push({label:'Reports have clear headings', pass:true});

  const body = document.getElementById('validationBody');
  const allPass = checks.every(c => c.pass);
  body.innerHTML =
    '<div class="validation-panel" style="border-left:3px solid '+(allPass?'var(--fern)':'var(--brick)')+'">'+
    '<h3 style="color:'+(allPass?'var(--fern)':'var(--brick)')+'">'+
    (allPass?'Workbook passes all validation checks':'Validation issues found')+'</h3>'+
    '<p style="font-size:12px;color:var(--ink2);margin-top:4px">'+
    (allPass?'Suitable for direct administrative review.':'Resolve the issues below before final review.')+'</p></div>'+
    checks.map(c =>
      '<div class="validation-item"><span class="val-icon '+(c.pass?'val-pass':'val-fail')+'">'+(c.pass?'&#10003;':'&#10007;')+'</span>'+
      '<span style="flex:1">'+c.label+'</span>'+
      (c.detail?'<span style="font-size:11px;color:'+(c.pass?'var(--fern)':'var(--brick)')+'">'+c.detail+'</span>':'')+
      '</div>'
    ).join('');
  openModal('validationModal');
}

function exportCSV() {
  let csv = 'Student ID,Last Name,First Name,Grade,Counselor,Course ID,Course Name,Department,Credits,Semester,Period,Prereq Grade,Flags\n';
  students.sort((a,b)=>a.last.localeCompare(b.last)).forEach(s => {
    const reqs=requests.filter(r=>r.studentId===s.studentId);
    const flags=getStudentFlags(s.studentId);
    reqs.forEach(r => {
      const c=COURSE_CATALOG.find(x=>x.id===r.courseId);
      const rowFlags=flags.filter(f=>f.rid===r.rid).map(f=>f.msg).join('; ');
      csv+=s.studentId+','+s.last+','+s.first+','+s.grade+','+s.counselor+','+r.courseId+','+(c?c.name:r.courseId)+','+(c?c.dept:'')+','+(c?c.credits:0)+','+r.semester+','+(r.period||'')+','+(r.prereqGrade||'')+','+rowFlags+'\n';
    });
  });
  const blob=new Blob([csv],{type:'text/csv'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='master_schedule_builder.csv'; a.click();
}

function handleFileImport(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const text = e.target.result;
    const lines = text.split(/\r?\n/).filter(l => l.trim());
    if (lines.length < 2) { alert('File appears empty.'); return; }
    const header = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, '').toLowerCase());
    const findCol = (...names) => {
      for (const n of names) {
        const idx = header.findIndex(h => h.includes(n));
        if (idx !== -1) return idx;
      }
      return -1;
    };
    const colId = findCol('person id', 'student id', 'studentid', 'id');
    const colName = findCol('student', 'name', 'last');
    const colGrade = findCol('grade', 'current grade');
    const colCourseId = findCol('course id', 'courseid', 'course code');
    const colCourseName = findCol('course name', 'coursename', 'course');

    if (colCourseName === -1 && colCourseId === -1) {
      alert('Could not find course columns. Expected headers with "Course Name" or "Course ID".');
      return;
    }

    const importedStudents = {};
    const importedRequests = [];
    let rid = nextRequestId;
    for (let i = 1; i < lines.length; i++) {
      const cols = parseCSVLine(lines[i]);
      if (cols.length < 2) continue;
      const studentId = colId >= 0 ? cols[colId]?.trim() : 'S' + i;
      const studentName = colName >= 0 ? cols[colName]?.trim() : '';
      const gradeRaw = colGrade >= 0 ? cols[colGrade]?.trim() : '';
      const courseId = colCourseId >= 0 ? cols[colCourseId]?.trim() : '';
      const courseName = colCourseName >= 0 ? cols[colCourseName]?.trim() : '';

      if (!studentId) continue;
      const gradeNum = parseInt(gradeRaw.replace(/[^0-9]/g, '')) || 9;

      if (!importedStudents[studentId]) {
        const parts = studentName.split(/[,\s]+/).filter(Boolean);
        importedStudents[studentId] = {
          studentId,
          last: parts[0] || studentId,
          first: parts.slice(1).join(' ') || '',
          grade: gradeNum,
          counselor: '',
          transcript: 'yes'
        };
      }

      const cid = courseId || courseName.replace(/\s+/g, '_').substring(0, 10);
      if (!COURSE_CATALOG.find(c => c.id === cid)) {
        COURSE_CATALOG.push({
          id: cid,
          name: courseName || cid,
          dept: 'Imported',
          credits: 5,
          grade: gradeNum,
          prereq: null,
          prereqGrade: null
        });
      }

      importedRequests.push({
        rid: rid++,
        studentId,
        courseId: cid,
        semester: 'FY',
        period: '',
        prereqGrade: '',
        notes: ''
      });
    }

    students = Object.values(importedStudents);
    requests = importedRequests;
    nextStudentId = Math.max(...students.map(s => parseInt(s.studentId) || 10000)) + 1;
    nextRequestId = rid;
    saveState();
    renderAll();
    alert('Imported ' + students.length + ' students and ' + requests.length + ' course requests.');
  };
  reader.readAsText(file);
  event.target.value = '';
}

function parseCSVLine(line) {
  const result = [];
  let current = '';
  let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (inQuotes) {
      if (ch === '"' && line[i + 1] === '"') { current += '"'; i++; }
      else if (ch === '"') inQuotes = false;
      else current += ch;
    } else {
      if (ch === '"') inQuotes = true;
      else if (ch === ',') { result.push(current); current = ''; }
      else current += ch;
    }
  }
  result.push(current);
  return result;
}
