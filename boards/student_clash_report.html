<title>Student Clash Report — Don Bosco Prep 2026-27</title>
<style>

:root{

  --text:#1a1412;--text2:#5c4f44;--text3:#8c7e73;
  --border:#d6cec6;--border2:#e8e2db;
  --maroon:#7B1E28;--maroon-lt:#A0333E;--maroon-pale:#f2e0e2;
  --red:#c0392b;--red-bg:#fde8e8;--red-cell:#e74c3c;
  --green:#27ae60;--green-bg:#e8f5e9;--green-cell:#2ecc71;
  --amber:#f39c12;--amber-bg:#fef9e7;
  --blue:#2980b9;--blue-bg:#e8f4fd;
  --hdr-bg:#7B1E28;--hdr-text:#fff;
  --font:'Segoe UI',system-ui,-apple-system,sans-serif;
  --mono:'SF Mono','Cascadia Code','Consolas',monospace;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1a1412;--surface:#242018;--surface2:#2e2820;--surface3:#3a3228;
  --text:#e8e2db;--text2:#b0a598;--text3:#7c7068;
  --border:#3e362e;--border2:#342e26;
  --maroon:#A0333E;--maroon-lt:#c04858;--maroon-pale:#3a2028;
  --red-bg:#3a1c1c;--green-bg:#1c2e1c;--amber-bg:#3a2e1c;--blue-bg:#1c2a3a;
  --hdr-bg:#5a1520;
}}
:root[data-theme="dark"]{
  --bg:#1a1412;--surface:#242018;--surface2:#2e2820;--surface3:#3a3228;
  --text:#e8e2db;--text2:#b0a598;--text3:#7c7068;
  --border:#3e362e;--border2:#342e26;
  --maroon:#A0333E;--maroon-lt:#c04858;--maroon-pale:#3a2028;
  --red-bg:#3a1c1c;--green-bg:#1c2e1c;--amber-bg:#3a2e1c;--blue-bg:#1c2a3a;
  --hdr-bg:#5a1520;
}
:root[data-theme="light"]{
  --bg:#f5f2ee;--surface:#fff;--surface2:#f8f6f3;--surface3:#ede9e4;
  --text:#1a1412;--text2:#5c4f44;--text3:#8c7e73;
  --border:#d6cec6;--border2:#e8e2db;
  --maroon:#7B1E28;--maroon-lt:#A0333E;--maroon-pale:#f2e0e2;
  --red-bg:#fde8e8;--green-bg:#e8f5e9;--amber-bg:#fef9e7;--blue-bg:#e8f4fd;
  --hdr-bg:#7B1E28;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--text)}
.toolbar{position:sticky;top:0;z-index:200;background:var(--hdr-bg);color:var(--hdr-text);
  padding:10px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  box-shadow:0 2px 8px rgba(0,0,0,.2)}
.toolbar h1{font-size:16px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.toolbar .stats{font-size:12px;opacity:.85;display:flex;gap:14px;flex-wrap:wrap}
.toolbar .stats span{white-space:nowrap}
.toolbar .actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn{padding:6px 14px;border:none;border-radius:4px;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{filter:brightness(1.1)}
.btn-outline{background:transparent;border:1px solid var(--hdr-text);color:var(--hdr-text)}
.btn-outline:hover{background:rgba(255,255,255,.1)}
.btn-accept{background:var(--green);color:#fff;padding:10px 28px;font-size:14px}
.btn-accept:hover{filter:brightness(1.1)}
.btn-reject{background:var(--surface3);color:var(--text);padding:10px 28px;font-size:14px}
.btn-reject:hover{filter:brightness(.95)}
.btn-sm{padding:4px 10px;font-size:11px}
.filter-bar{background:var(--surface);border-bottom:1px solid var(--border);
  padding:8px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:12px}
.filter-bar label{color:var(--text2);font-weight:600}
.filter-bar select,.filter-bar input{padding:4px 8px;border:1px solid var(--border);
  border-radius:4px;font-size:12px;background:var(--surface);color:var(--text)}
.filter-bar input[type="search"]{width:180px}
.filter-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.summary-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:12px;padding:14px 20px;background:var(--surface2);border-bottom:1px solid var(--border)}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:6px;
  padding:12px 14px;text-align:center}
.stat-card .val{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.stat-card .lbl{font-size:11px;color:var(--text2);margin-top:2px}
.stat-card.red .val{color:var(--red)}
.stat-card.green .val{color:var(--green)}
.stat-card.amber .val{color:var(--amber)}
.stat-card.blue .val{color:var(--blue)}
.student-list{padding:12px 20px;display:flex;flex-direction:column;gap:8px}
.student-card{background:var(--surface);border:1px solid var(--border);border-radius:6px;overflow:hidden}
.student-hdr{padding:10px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;
  transition:background .15s;user-select:none}
.student-hdr:hover{background:var(--surface2)}
.student-hdr .arrow{font-size:10px;color:var(--text3);transition:transform .2s;width:14px}
.student-hdr .arrow.open{transform:rotate(90deg)}
.student-hdr .sid{font-family:var(--mono);font-size:12px;color:var(--text2)}
.student-hdr .sname{font-weight:600;font-size:13px}
.student-hdr .grade{font-size:12px;color:var(--text2)}
.student-hdr .clash-badge{background:var(--red);color:#fff;font-size:11px;font-weight:700;
  padding:2px 8px;border-radius:10px;white-space:nowrap}
.student-hdr .clash-badge.resolved{background:var(--green)}
.student-hdr .placed{font-size:12px;color:var(--text2);margin-left:auto;white-space:nowrap}
.student-body{display:none;padding:0 14px 14px;border-top:1px solid var(--border2)}
.student-body.open{display:block}
.grid-label{font-size:11px;font-weight:700;color:var(--text2);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.04em}
.sched-grid{display:grid;grid-template-columns:44px 1fr 1fr;gap:2px;margin-bottom:12px}
.sched-grid .hdr{background:var(--surface3);padding:6px 8px;font-size:11px;font-weight:700;
  color:var(--text2);text-align:center;border-radius:3px}
.sched-grid .plbl{background:var(--surface3);padding:6px 4px;font-size:11px;font-weight:700;
  color:var(--text2);text-align:center;border-radius:3px;display:flex;align-items:center;justify-content:center}
.sched-grid .cell{min-height:48px;background:var(--surface2);border:2px solid transparent;
  border-radius:4px;padding:3px;position:relative;transition:all .15s}
.sched-grid .cell.drop-target{background:var(--blue-bg);border-color:var(--blue);outline:none}
.sched-grid .cell.drop-invalid{background:var(--red-bg);border-color:var(--red)}
.sched-grid .cell.fy-left{border-top-right-radius:0;border-bottom-right-radius:0;border-right:none}
.sched-grid .cell.fy-right{border-top-left-radius:0;border-bottom-left-radius:0;border-left:none}
.tile{padding:5px 7px;border-radius:4px;font-size:11px;cursor:grab;
  transition:transform .1s,box-shadow .1s;border-left:3px solid transparent;position:relative}
.tile:hover{transform:translateY(-1px);box-shadow:0 2px 8px rgba(0,0,0,.12)}
.tile:active{cursor:grabbing}
.tile.placed{background:var(--green-bg);border-left-color:var(--green-cell)}
.tile.clashed{background:var(--red-bg);border-left-color:var(--red-cell);opacity:.8;cursor:default}
.tile.moved{background:#e0f0ff;border-left-color:var(--blue);outline:1px dashed var(--blue)}
.tile.dragging{opacity:.3}
.tile .tile-top{display:flex;justify-content:space-between;align-items:center;gap:4px}
.tile .code{font-weight:700;font-family:var(--mono);font-size:11px}
.tile .sec{font-size:10px;color:var(--text3)}
.tile .enroll{font-size:10px;font-weight:600;font-family:var(--mono);padding:1px 4px;border-radius:3px}
.tile .enroll.over{background:var(--red-bg);color:var(--red)}
.tile .enroll.ok{background:var(--green-bg);color:var(--green)}
.tile .enroll.warn{background:var(--amber-bg);color:var(--amber)}
.tile .tile-name{font-size:10px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:1px 0}
.tile .tile-teacher{font-size:10px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.fy-span{position:absolute;left:0;top:3px;right:0;bottom:3px;width:calc(200% + 6px);z-index:5}
.ghost-tile{position:fixed;pointer-events:none;z-index:1000;padding:6px 10px;border-radius:4px;
  font-size:12px;font-weight:700;color:#fff;background:var(--green-cell);box-shadow:0 4px 16px rgba(0,0,0,.25);
  transform:translate(-50%,-50%);opacity:.9;white-space:nowrap}
.unscheduled-section{margin-top:8px}
.unsched-item{background:var(--red-bg);border:1px solid var(--red);border-radius:6px;padding:10px 12px;margin-bottom:6px}
.unsched-item .unsched-title{font-weight:600;font-size:12px;color:var(--red)}
.unsched-item .unsched-detail{font-size:11px;color:var(--text2);margin-top:4px}
.unsched-item .unsched-detail.resolvable{color:var(--green);font-weight:600}
.alt-sections{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.alt-pill{font-size:10px;padding:3px 8px;border-radius:4px;background:var(--surface3);color:var(--text2);
  border:1px solid var(--border);white-space:nowrap}
.alt-pill.available{background:var(--green-bg);border-color:var(--green);color:var(--green);cursor:pointer}
.alt-pill.available:hover{filter:brightness(.95)}
.impact-overlay{display:none;position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.5);
  align-items:center;justify-content:center}
.impact-overlay.visible{display:flex}
.impact-panel{background:var(--surface);border-radius:10px;max-width:640px;width:90vw;
  max-height:85vh;overflow-y:auto;box-shadow:0 8px 40px rgba(0,0,0,.3)}
.impact-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.impact-header h3{font-size:15px;font-weight:700}
.impact-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--text3);line-height:1}
.impact-move{padding:12px 20px;background:var(--surface2);border-bottom:1px solid var(--border);font-size:13px}
.impact-move .move-code{font-weight:700;font-family:var(--mono)}
.impact-move .move-arrow{display:inline-block;margin:0 6px;color:var(--blue);font-weight:700}
.impact-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:16px 20px;border-bottom:1px solid var(--border)}
.impact-stat{text-align:center;padding:10px 6px;border-radius:6px;background:var(--surface2)}
.impact-stat .iv{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.impact-stat .il{font-size:10px;color:var(--text2);margin-top:2px}
.impact-stat.bad{background:var(--red-bg)} .impact-stat.bad .iv{color:var(--red)}
.impact-stat.good{background:var(--green-bg)} .impact-stat.good .iv{color:var(--green)}
.impact-stat.neutral .iv{color:var(--text)}
.impact-list{padding:10px 20px;max-height:180px;overflow-y:auto}
.impact-list h4{font-size:12px;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.impact-list h4 .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.impact-list h4 .dot.red{background:var(--red)}
.impact-list h4 .dot.green{background:var(--green)}
.impact-list ul{list-style:none;font-size:11px}
.impact-list li{padding:3px 0;border-bottom:1px solid var(--border2)}
.impact-list li:last-child{border:none}
.impact-list .isid{font-family:var(--mono);color:var(--text3);margin-right:6px}
.impact-list .iwith{color:var(--text2);font-style:italic}
.impact-actions{padding:16px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:12px}
.change-log{position:fixed;bottom:16px;right:16px;z-index:300;background:var(--surface);
  border:1px solid var(--border);border-radius:8px;width:320px;box-shadow:0 4px 20px rgba(0,0,0,.15);
  display:none;flex-direction:column;max-height:400px}
.change-log.visible{display:flex}
.change-log-hdr{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;background:var(--surface2);border-radius:8px 8px 0 0}
.change-log-hdr h3{font-size:13px;font-weight:700}
.change-log-hdr .count{font-size:11px;color:var(--text2)}
.change-log-body{flex:1;overflow-y:auto;padding:8px}
.change-entry{padding:6px 8px;border-bottom:1px solid var(--border2);font-size:11px;display:flex;justify-content:space-between;align-items:center}
.change-entry:last-child{border:none}
.change-entry .cdesc{flex:1}
.change-entry .cnet{font-weight:600;margin:0 8px;white-space:nowrap}
.change-entry .cnet.pos{color:var(--red)}
.change-entry .cnet.neg{color:var(--green)}
.change-log-footer{padding:8px 14px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
.changelog-toggle{position:fixed;bottom:16px;right:16px;z-index:299;background:var(--maroon);color:#fff;
  border:none;border-radius:20px;padding:8px 16px;font-size:12px;font-weight:600;cursor:pointer;
  box-shadow:0 2px 12px rgba(0,0,0,.2);display:none}
.changelog-toggle.visible{display:block}
.popover{position:fixed;z-index:400;background:var(--surface);border:1px solid var(--border);
  border-radius:8px;width:300px;box-shadow:0 4px 20px rgba(0,0,0,.2);font-size:12px;overflow:hidden}
.popover-hdr{padding:10px 12px;background:var(--surface2);border-bottom:1px solid var(--border);font-weight:700}
.popover-body{padding:10px 12px}
.popover-row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--border2)}
.popover-row:last-child{border:none}
.popover-row .pk{color:var(--text2)}
.popover-enroll-bar{height:6px;background:var(--surface3);border-radius:3px;margin-top:6px;overflow:hidden}
.popover-enroll-bar .fill{height:100%;border-radius:3px;transition:width .3s}
.popover-students{margin-top:8px;max-height:120px;overflow-y:auto;font-size:11px;color:var(--text2)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;
  padding:10px 20px;border-radius:6px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:600}
.toast.show{opacity:1}
.toast.error{background:var(--red)}
.toast.success{background:var(--green)}
.toast.info{background:var(--blue)}
.zoom-wrap{transform-origin:top left}
@media(max-width:700px){
  .summary-cards{grid-template-columns:repeat(3,1fr)}
  .sched-grid{font-size:10px}
  .impact-stats{grid-template-columns:repeat(2,1fr)}
}

</style>

<div class="toolbar">
  <h1>Student Clash Report</h1>
  <div class="stats">
    <span id="statClashes">Clashes: --</span>
    <span id="statPlaced">Placed: --</span>
    <span id="statStudents">Affected: --</span>
    <span id="statMoves">Moves: 0</span>
  </div>
  <div class="actions">
    <button class="btn btn-outline btn-sm" onclick="expandAll()">Expand All</button>
    <button class="btn btn-outline btn-sm" onclick="collapseAll()">Collapse All</button>
    <button class="btn btn-outline btn-sm" onclick="exportCSV()">CSV</button>
    <button class="btn btn-outline btn-sm" onclick="exportJSON()">JSON</button>
    <button class="btn btn-outline btn-sm" onclick="exportChanges()">Export Changes</button>
  </div>
</div>
<div class="filter-bar">
  <label>Grade</label><select id="fGrade"><option value="all">All</option></select>

  <div class="filter-actions">
    <label style="font-size:11px;color:var(--text3)">Zoom</label>
    <button class="btn btn-sm btn-reject" id="zoomOut">-</button>
    <span id="zoomLvl" style="font-size:11px;min-width:30px;text-align:center">100%</span>
    <button class="btn btn-sm btn-reject" id="zoomIn">+</button>
  </div>
</div>
<div class="summary-cards" id="summaryCards"></div>
<div class="zoom-wrap" id="zoomWrap">
  <div class="student-list" id="studentList"></div>
</div>
<div class="impact-overlay" id="impactOverlay">
  <div class="impact-panel" id="impactPanel"></div>
</div>
<div class="change-log" id="changeLog">
  <div class="change-log-hdr"><h3>Change Log</h3><span class="count" id="clCount">0</span></div>
  <div class="change-log-body" id="clBody"></div>
  <div class="change-log-footer">
    <button class="btn btn-sm btn-reject" onclick="resetAllMoves()">Reset All</button>
    <button class="btn btn-sm btn-primary" onclick="exportChanges()">Export</button>
  </div>
</div>
<button class="changelog-toggle" id="clToggle" onclick="toggleChangeLog()">Changes (0)</button>
<div class="popover" id="popover" style="display:none"></div>
<div class="toast" id="toast"></div>

const PERIODS=['A','B','C','D','E','F','G'];
const HL={1:'S1',2:'S2',3:'FY'};

// State
const moves=new Map();
const expanded=new Set();
let dragState=null, ghostEl=null, pendingImpact=null;
let currentZoom=100;

// Lookup caches
const secMap=new Map();
D.S.forEach(s=>secMap.set(s[0]+'-'+s[9],s));
const titleMap=new Map();
D.S.forEach(s=>{if(!titleMap.has(s[0]))titleMap.set(s[0],s[1])});

function halvesOverlap(a,b){return(a&b)!==0}
function halvesLabel(h){return HL[h]||'?'}
function getName(sid){const n=D.N[sid];return n?n[0]:sid}
function getTitle(code){return titleMap.get(code)||code}
function truncate(s,n){return s.length>n?s.slice(0,n-1)+'…':s}

function getEffective(code,sec){
  const key=code+'-'+sec;
  const m=moves.get(key);
  if(m)return{p:m.toP,h:m.toH};
  const s=secMap.get(key);
  if(s)return{p:s[3],h:s[4]};
  return null;
}

function getSectionInfo(code,sec){
  const key=code+'-'+sec;
  const s=secMap.get(key);
  if(!s)return null;
  const eff=getEffective(code,sec);
  return{code:s[0],title:s[1],dept:s[2],period:eff.p,halves:eff.h,
    teacher:s[5],room:s[6],cap:s[7],enrolled:s[8],sec:s[9],
    origP:s[3],origH:s[4],moved:!!moves.has(key)};
}

function getStudentSchedule(student){
  const result=[];
  for(const[code,d]of Object.entries(student.sc)){
    const sec=d[5];
    const eff=getEffective(code,sec);
    const sk=code+'-'+sec;
    const si=secMap.get(sk);
    result.push({code,title:d[0],period:eff?eff.p:d[1],halves:eff?eff.h:d[2],
      origP:d[1],origH:d[2],teacher:d[3],room:d[4],sec,
      enrolled:si?si[8]:0,cap:si?si[7]:0,moved:moves.has(sk)});
  }
  return result;
}

function getBlocker(student,lostP,lostH){
  for(const[code,d]of Object.entries(student.sc)){
    const eff=getEffective(code,d[5]);
    if(eff&&eff.p===lostP&&halvesOverlap(eff.h,lostH))
      return{code,title:d[0]};
  }
  return null;
}

function countClashes(student){
  let count=0;
  for(const cl of student.cl){
    const blocker=getBlocker(student,cl[2],cl[3]);
    if(blocker)count++;
  }
  return count;
}

// Impact analysis
function analyzeImpact(code,sec,fromP,fromH,toP,toH){
  const key=code+'-'+sec;
  const students=D.SS[key]||[];
  const si=secMap.get(key);
  const cap=si?si[7]:0;
  let stay=0,conflicted=0;
  const conflictedList=[],potentialList=[];

  for(const sid of students){
    const occ=D.O[sid];
    if(!occ){stay++;continue}
    let hasConflict=false,conflictCode=null;
    for(const e of occ){
      if(e[0]===code)continue;
      const ef=getEffective(e[0],e[3]);
      if(ef&&ef.p===toP&&halvesOverlap(ef.h,toH)){
        hasConflict=true;conflictCode=e[0];break;
      }
    }
    if(hasConflict){
      conflicted++;
      conflictedList.push({sid,name:getName(sid),with:conflictCode});
    } else stay++;
  }

  for(const st of D.C){
    for(const cl of st.cl){
      if(cl[0]!==code)continue;
      const occ=D.O[st.id];
      if(!occ)continue;
      let ok=true;
      for(const e of occ){
        if(e[0]===code)continue;
        const ef=getEffective(e[0],e[3]);
        if(ef&&ef.p===toP&&halvesOverlap(ef.h,toH)){ok=false;break}
      }
      if(ok)potentialList.push({sid:st.id,name:st.n});
    }
  }

  return{code,sec,key,fromP,fromH,toP,toH,
    current:students.length,stay,conflicted,conflictedList,
    potential:potentialList.length,potentialList,
    projected:stay+potentialList.length,cap};
}

// Render summary
function renderSummary(){
  const el=document.getElementById('summaryCards');
  let totalClashes=0,multiClash=0,g12=0,g11=0,g10=0;
  for(const st of D.C){
    const cc=countClashes(st);
    totalClashes+=cc;
    if(cc>=2)multiClash++;
    if(st.g===12)g12+=cc;
    else if(st.g===11)g11+=cc;
    else if(st.g===10)g10+=cc;
  }
  const placed=D.stats.placed||0,total=D.stats.total_requests||0;
  const rate=total?((placed/total)*100).toFixed(1):'--';
  el.innerHTML=`
    <div class="stat-card red"><div class="val">${totalClashes}</div><div class="lbl">Active Clashes</div></div>
    <div class="stat-card green"><div class="val">${rate}%</div><div class="lbl">Placement Rate</div></div>
    <div class="stat-card amber"><div class="val">${multiClash}</div><div class="lbl">Multi-Clash Students</div></div>
    <div class="stat-card"><div class="val">${g12}</div><div class="lbl">Grade 12 Clashes</div></div>
    <div class="stat-card"><div class="val">${g11}</div><div class="lbl">Grade 11 Clashes</div></div>
    <div class="stat-card"><div class="val">${g10}</div><div class="lbl">Grade 10 Clashes</div></div>`;
  document.getElementById('statClashes').textContent='Clashes: '+totalClashes;
  document.getElementById('statStudents').textContent='Affected: '+D.C.length;
  document.getElementById('statPlaced').textContent='Placed: '+(D.stats.placed||'--')+'/'+(D.stats.total_requests||'--');
  document.getElementById('statMoves').textContent='Moves: '+moves.size;
}

function populateFilters(){
  const grades=new Set(),depts=new Set(),courses=new Set();
  for(const st of D.C){
    grades.add(st.g);
    for(const[code,d]of Object.entries(st.sc)){depts.add(secMap.get(code+'-'+d[5])?.[2]||'');courses.add(code+' '+d[0])}
    for(const cl of st.cl){courses.add(cl[0]+' '+cl[1])}
  }
  const gSel=document.getElementById('fGrade');
  [...grades].sort().forEach(g=>{const o=document.createElement('option');o.value=g;o.textContent='Grade '+g;gSel.appendChild(o)});
  const dSel=document.getElementById('fDept');
  [...depts].filter(Boolean).sort().forEach(d=>{const o=document.createElement('option');o.value=d;o.textContent=d;dSel.appendChild(o)});
  const cSel=document.getElementById('fCourse');
  [...courses].sort().forEach(c=>{const o=document.createElement('option');o.value=c.split(' ')[0];o.textContent=truncate(c,40);cSel.appendChild(o)});
  [gSel,dSel,cSel,document.getElementById('fClash'),document.getElementById('fSearch')]
    .forEach(el=>el.addEventListener(el.tagName==='INPUT'?'input':'change',renderList));
}

function matchesFilter(st){
  const g=document.getElementById('fGrade').value;
  if(g!=='all'&&st.g!==parseInt(g))return false;
  const cc=countClashes(st);
  const fc=document.getElementById('fClash').value;
  if(fc==='1'&&cc!==1)return false;
  if(fc==='2'&&cc!==2)return false;
  if(fc==='3'&&cc<3)return false;
  const fd=document.getElementById('fDept').value;
  if(fd!=='all'){
    let hasDept=false;
    for(const[code,d]of Object.entries(st.sc)){
      const si=secMap.get(code+'-'+d[5]);
      if(si&&si[2]===fd){hasDept=true;break}
    }
    if(!hasDept)return false;
  }
  const fcr=document.getElementById('fCourse').value;
  if(fcr!=='all'){
    let hasCourse=false;
    if(st.sc[fcr])hasCourse=true;
    for(const cl of st.cl){if(cl[0]===fcr)hasCourse=true}
    if(!hasCourse)return false;
  }
  const fs=document.getElementById('fSearch').value.toLowerCase().trim();
  if(fs&&!st.n.toLowerCase().includes(fs)&&!st.id.includes(fs))return false;
  return true;
}

function renderList(){
  const list=document.getElementById('studentList');
  list.innerHTML='';
  const sorted=[...D.C].sort((a,b)=>countClashes(b)-countClashes(a)||a.g-b.g||a.n.localeCompare(b.n));
  let shown=0;
  for(const st of sorted){
    if(!matchesFilter(st))continue;
    shown++;
    const card=document.createElement('div');
    card.className='student-card';
    card.dataset.sid=st.id;
    const cc=countClashes(st);
    const totalSched=Object.keys(st.sc).length;
    const totalReq=totalSched+st.cl.length;
    const isOpen=expanded.has(st.id);

    card.innerHTML=`
      <div class="student-hdr">
        <span class="arrow ${isOpen?'open':''}">▶</span>
        <span class="sid">${st.id}</span>
        <span class="sname">${st.n}</span>
        <span class="grade">Grade ${st.g}</span>
        <span class="clash-badge ${cc===0?'resolved':''}">${cc} clash${cc!==1?'es':''}</span>
        <span class="placed">${totalSched}/${totalReq} placed</span>
      </div>
      <div class="student-body ${isOpen?'open':''}"></div>`;

    card.querySelector('.student-hdr').addEventListener('click',()=>{
      const body=card.querySelector('.student-body');
      const arrow=card.querySelector('.arrow');
      if(body.classList.contains('open')){
        body.classList.remove('open');
        arrow.classList.remove('open');
        expanded.delete(st.id);
      } else {
        body.classList.add('open');
        arrow.classList.add('open');
        expanded.add(st.id);
        renderStudentBody(body,st);
      }
    });
    if(isOpen)renderStudentBody(card.querySelector('.student-body'),st);
    list.appendChild(card);
  }
}

function renderStudentBody(body,student){
  const sched=getStudentSchedule(student);
  let html='<div class="grid-label">Schedule</div>';
  html+='<div class="sched-grid">';
  html+='<div class="hdr"></div><div class="hdr">Semester 1</div><div class="hdr">Semester 2</div>';

  for(const p of PERIODS){
    html+='<div class="plbl">'+p+'</div>';
    for(const sem of[1,2]){
      const placed=sched.filter(c=>c.period===p&&halvesOverlap(c.halves,sem));
      const fyHere=sched.filter(c=>c.period===p&&c.halves===3);
      const isFyLeft=sem===1&&fyHere.length>0;
      const isFyRight=sem===2&&fyHere.length>0;
      let cellCls='cell';
      if(isFyLeft)cellCls+=' fy-left';
      if(isFyRight)cellCls+=' fy-right';
      html+=`<div class="${cellCls}" data-period="${p}" data-sem="${sem}" data-student="${student.id}" data-droppable="1">`;

      if(isFyRight&&fyHere.length>0){
        html+='</div>';continue;
      }

      for(const c of placed){
        const enrollCls=c.enrolled>c.cap?'over':(c.enrolled>=c.cap*0.9?'warn':'ok');
        const tileCls='tile placed'+(c.moved?' moved':'')+(c.halves===3?' fy-span':'');
        html+=`<div class="${tileCls}" draggable="true" data-code="${c.code}" data-sec="${c.sec}" data-student="${student.id}" data-period="${c.period}" data-halves="${c.halves}">`;
        html+=`<div class="tile-top"><span class="code">${c.code}</span><span class="sec">§${c.sec}</span><span class="enroll ${enrollCls}">${c.enrolled}/${c.cap}</span></div>`;
        html+=`<div class="tile-name">${truncate(c.title,20)}</div>`;
        html+=`<div class="tile-teacher">${c.teacher.split(',')[0]}</div>`;
        html+='</div>';
      }

      const clashesHere=student.cl.filter(cl=>cl[2]===p&&halvesOverlap(cl[3],sem));
      for(const cl of clashesHere){
        const blocker=getBlocker(student,cl[2],cl[3]);
        if(!blocker)continue;
        html+=`<div class="tile clashed" data-code="${cl[0]}">`;
        html+=`<div class="tile-top"><span class="code">${cl[0]}</span><span class="sec" style="color:var(--red)">UNSCHED</span></div>`;
        html+=`<div class="tile-name" style="text-decoration:line-through">${truncate(cl[1],18)}</div>`;
        html+='</div>';
      }
      html+='</div>';
    }
  }
  html+='</div>';

  // Unscheduled courses detail
  const activeClashes=student.cl.filter(cl=>getBlocker(student,cl[2],cl[3]));
  if(activeClashes.length>0){
    html+='<div class="grid-label">Unscheduled Courses</div><div class="unscheduled-section">';
    for(const cl of activeClashes){
      const blocker=getBlocker(student,cl[2],cl[3]);
      const altSecs=(D.CS[cl[0]]||[]).map(as=>{
        const eff=getEffective(cl[0],as[0]);
        const ep=eff?eff.p:as[1];
        const eh=eff?eff.h:as[2];
        let canPlace=true;
        for(const[code,d]of Object.entries(student.sc)){
          const ce=getEffective(code,d[5]);
          if(ce&&ce.p===ep&&halvesOverlap(ce.h,eh)){canPlace=false;break}
        }
        return{sec:as[0],p:ep,h:eh,teacher:as[3],enrolled:as[4],cap:as[5],available:canPlace};
      });
      html+=`<div class="unsched-item">`;
      html+=`<div class="unsched-title">${cl[0]} ${cl[1]} — Period ${cl[2]} (${halvesLabel(cl[3])})</div>`;
      html+=`<div class="unsched-detail">Blocked by: ${blocker.code} ${blocker.title}</div>`;
      const avail=altSecs.filter(a=>a.available);
      if(avail.length>0){
        html+=`<div class="unsched-detail resolvable">${avail.length} alternative section${avail.length>1?'s':''} available</div>`;
      }
      html+=`<div class="alt-sections">`;
      for(const a of altSecs){
        const cls=a.available?'alt-pill available':'alt-pill';
        html+=`<span class="${cls}" ${a.available?`onclick="quickPlace('${student.id}','${cl[0]}',${a.sec})"`:''}>`;
        html+=`§${a.sec} Per ${a.p} (${halvesLabel(a.h)}) ${a.enrolled}/${a.cap}`;
        html+='</span>';
      }
      html+='</div></div>';
    }
    html+='</div>';
  }

  // Resolved clashes
  const resolved=student.cl.filter(cl=>!getBlocker(student,cl[2],cl[3]));
  if(resolved.length>0){
    html+='<div class="grid-label" style="color:var(--green)">Resolved Clashes</div>';
    for(const cl of resolved){
      html+=`<div style="font-size:12px;color:var(--green);padding:4px 0">${cl[0]} ${cl[1]} — conflict cleared by section move</div>`;
    }
  }

  body.innerHTML=html;
  bindTileEvents(body);
}

function bindTileEvents(container){
  container.querySelectorAll('.tile.placed').forEach(tile=>{
    tile.addEventListener('dragstart',handleDragStart);
    tile.addEventListener('dragend',handleDragEnd);
    tile.addEventListener('click',e=>{e.stopPropagation();showPopover(tile)});
  });
  container.querySelectorAll('.cell[data-droppable]').forEach(cell=>{
    cell.addEventListener('dragover',handleDragOver);
    cell.addEventListener('dragleave',handleDragLeave);
    cell.addEventListener('drop',handleDrop);
  });
}

// Drag and drop
function handleDragStart(e){
  const tile=e.target.closest('.tile');
  if(!tile||tile.classList.contains('clashed'))return;
  const code=tile.dataset.code,sec=parseInt(tile.dataset.sec);
  const h=parseInt(tile.dataset.halves),p=tile.dataset.period;
  const sid=tile.dataset.student;
  dragState={code,sec,fromP:p,fromH:h,studentId:sid};
  tile.classList.add('dragging');
  ghostEl=document.createElement('div');
  ghostEl.className='ghost-tile';
  ghostEl.textContent=code+' §'+sec;
  document.body.appendChild(ghostEl);
  const blank=document.createElement('canvas');
  blank.width=1;blank.height=1;
  e.dataTransfer.setDragImage(blank,0,0);
  e.dataTransfer.effectAllowed='move';
  e.dataTransfer.setData('text/plain',code);
  document.addEventListener('mousemove',moveGhost);
  document.addEventListener('dragover',moveGhost);
}

function moveGhost(e){
  if(ghostEl){ghostEl.style.left=e.clientX+'px';ghostEl.style.top=e.clientY+'px'}
}

function handleDragEnd(e){
  e.target.classList.remove('dragging');
  if(ghostEl){ghostEl.remove();ghostEl=null}
  document.removeEventListener('mousemove',moveGhost);
  document.removeEventListener('dragover',moveGhost);
  dragState=null;
  document.querySelectorAll('.drop-target,.drop-invalid').forEach(el=>el.classList.remove('drop-target','drop-invalid'));
}

function handleDragOver(e){
  e.preventDefault();
  if(!dragState)return;
  const cell=e.currentTarget;
  const tp=cell.dataset.period;
  const ts=parseInt(cell.dataset.sem);
  const student=D.C.find(s=>s.id===dragState.studentId);
  if(!student)return;

  let toH=dragState.fromH===3?3:ts;
  if(tp===dragState.fromP&&toH===dragState.fromH){
    cell.classList.remove('drop-target','drop-invalid');
    e.dataTransfer.dropEffect='none';return;
  }

  let occupied=false;
  for(const[code,d]of Object.entries(student.sc)){
    if(code===dragState.code)continue;
    const eff=getEffective(code,d[5]);
    if(eff&&eff.p===tp&&halvesOverlap(eff.h,toH)){occupied=true;break}
  }

  if(occupied){
    cell.classList.add('drop-invalid');cell.classList.remove('drop-target');
    if(ghostEl)ghostEl.style.background='var(--red-cell)';
  } else {
    cell.classList.add('drop-target');cell.classList.remove('drop-invalid');
    if(ghostEl)ghostEl.style.background='var(--green-cell)';
  }
  e.dataTransfer.dropEffect='move';
}

function handleDragLeave(e){
  e.currentTarget.classList.remove('drop-target','drop-invalid');
}

function handleDrop(e){
  e.preventDefault();
  const cell=e.currentTarget;
  cell.classList.remove('drop-target','drop-invalid');
  if(!dragState)return;

  const tp=cell.dataset.period;
  const ts=parseInt(cell.dataset.sem);
  let toH=dragState.fromH===3?3:ts;

  if(tp===dragState.fromP&&toH===dragState.fromH)return;

  const impact=analyzeImpact(dragState.code,dragState.sec,dragState.fromP,dragState.fromH,tp,toH);
  pendingImpact=impact;
  showImpactPanel(impact);
}

function showImpactPanel(imp){
  const overlay=document.getElementById('impactOverlay');
  const panel=document.getElementById('impactPanel');
  const si=secMap.get(imp.key);
  const title=si?si[1]:imp.code;
  const netCls=imp.conflicted>imp.potential?'bad':(imp.potential>imp.conflicted?'good':'neutral');

  let html=`
    <div class="impact-header"><h3>Impact Analysis — Proposed Section Move</h3>
      <button class="impact-close" onclick="hideImpact()">&times;</button></div>
    <div class="impact-move">
      <span class="move-code">${imp.code} ${title} §${imp.sec}</span><br>
      Period <b>${imp.fromP}</b> (${halvesLabel(imp.fromH)})
      <span class="move-arrow">→</span>
      Period <b>${imp.toP}</b> (${halvesLabel(imp.toH)})
    </div>
    <div class="impact-stats">
      <div class="impact-stat neutral"><div class="iv">${imp.current}</div><div class="il">Current Enrollment</div></div>
      <div class="impact-stat bad"><div class="iv">${imp.conflicted}</div><div class="il">Would Conflict</div></div>
      <div class="impact-stat good"><div class="iv">${imp.potential}</div><div class="il">Could Enroll</div></div>
      <div class="impact-stat ${netCls}"><div class="iv">${imp.projected}</div><div class="il">Projected / ${imp.cap} cap</div></div>
    </div>`;

  if(imp.conflictedList.length>0){
    html+=`<div class="impact-list"><h4><span class="dot red"></span>Students Who Would Gain Conflicts (${imp.conflicted})</h4><ul>`;
    for(const s of imp.conflictedList.slice(0,50)){
      html+=`<li><span class="isid">${s.sid}</span>${s.name} <span class="iwith">— clashes with ${s.with} ${getTitle(s.with)}</span></li>`;
    }
    if(imp.conflictedList.length>50)html+=`<li style="color:var(--text3)">... and ${imp.conflictedList.length-50} more</li>`;
    html+='</ul></div>';
  }
  if(imp.potentialList.length>0){
    html+=`<div class="impact-list"><h4><span class="dot green"></span>Students Who Could Now Enroll (${imp.potential})</h4><ul>`;
    for(const s of imp.potentialList.slice(0,50)){
      html+=`<li><span class="isid">${s.sid}</span>${s.name}</li>`;
    }
    if(imp.potentialList.length>50)html+=`<li style="color:var(--text3)">... and ${imp.potentialList.length-50} more</li>`;
    html+='</ul></div>';
  }
  html+=`<div class="impact-actions">
    <button class="btn btn-reject" onclick="hideImpact()">Reject</button>
    <button class="btn btn-accept" onclick="acceptMove()">Accept Move</button></div>`;
  panel.innerHTML=html;
  overlay.classList.add('visible');
}

function hideImpact(){
  document.getElementById('impactOverlay').classList.remove('visible');
  pendingImpact=null;
}

function acceptMove(){
  if(!pendingImpact)return;
  const imp=pendingImpact;
  moves.set(imp.key,{code:imp.code,sec:imp.sec,fromP:imp.fromP,fromH:imp.fromH,
    toP:imp.toP,toH:imp.toH,impact:imp});
  hideImpact();
  refreshAll();
  showToast(`Moved ${imp.code} §${imp.sec}: Period ${imp.fromP}→${imp.toP} (${imp.conflicted} conflicts, ${imp.potential} gains)`,'success');
}

function undoMove(key){
  moves.delete(key);
  refreshAll();
  showToast('Move undone','info');
}

function resetAllMoves(){
  moves.clear();
  refreshAll();
  showToast('All moves reset','info');
}

function refreshAll(){
  renderSummary();
  renderList();
  updateChangeLog();
}

function updateChangeLog(){
  const body=document.getElementById('clBody');
  const toggle=document.getElementById('clToggle');
  const log=document.getElementById('changeLog');
  document.getElementById('clCount').textContent=moves.size+' move'+(moves.size!==1?'s':'');
  toggle.textContent='Changes ('+moves.size+')';

  if(moves.size===0){
    log.classList.remove('visible');
    toggle.classList.remove('visible');
    return;
  }
  toggle.classList.add('visible');

  let html='';
  for(const[key,m]of moves){
    const net=m.impact.conflicted-m.impact.potential;
    const netCls=net>0?'pos':(net<0?'neg':'');
    html+=`<div class="change-entry">
      <span class="cdesc">${m.code} §${m.sec}: ${m.fromP}(${halvesLabel(m.fromH)})→${m.toP}(${halvesLabel(m.toH)})</span>
      <span class="cnet ${netCls}">${net>0?'+':''}${net}</span>
      <button class="btn btn-sm btn-reject" onclick="undoMove('${key}')">Undo</button>
    </div>`;
  }
  body.innerHTML=html;
}

function toggleChangeLog(){
  const log=document.getElementById('changeLog');
  log.classList.toggle('visible');
}

// Popover
function showPopover(tile){
  const pop=document.getElementById('popover');
  const code=tile.dataset.code,sec=parseInt(tile.dataset.sec);
  const info=getSectionInfo(code,sec);
  if(!info){pop.style.display='none';return}
  const key=code+'-'+sec;
  const students=D.SS[key]||[];
  const pct=info.cap>0?Math.round((info.enrolled/info.cap)*100):0;
  const barColor=pct>100?'var(--red)':(pct>=90?'var(--amber)':'var(--green)');

  let html=`<div class="popover-hdr">${code} ${info.title} §${sec}</div><div class="popover-body">`;
  html+=`<div class="popover-row"><span class="pk">Teacher</span><span>${info.teacher}</span></div>`;
  html+=`<div class="popover-row"><span class="pk">Room</span><span>${info.room}</span></div>`;
  html+=`<div class="popover-row"><span class="pk">Period</span><span>${info.period} (${halvesLabel(info.halves)})</span></div>`;
  html+=`<div class="popover-row"><span class="pk">Enrollment</span><span>${info.enrolled} / ${info.cap}</span></div>`;
  html+=`<div class="popover-enroll-bar"><div class="fill" style="width:${Math.min(pct,100)}%;background:${barColor}"></div></div>`;
  if(info.moved){
    html+=`<div class="popover-row" style="color:var(--blue)"><span class="pk">Original</span><span>Period ${info.origP} (${halvesLabel(info.origH)})</span></div>`;
  }
  html+=`<div class="popover-row"><span class="pk">Students</span><span>${students.length} enrolled</span></div>`;
  if(students.length>0&&students.length<=20){
    html+=`<div class="popover-students">`;
    for(const sid of students.slice(0,20)){
      html+=`<div>${sid} ${getName(sid)}</div>`;
    }
    html+='</div>';
  }
  html+='</div>';
  pop.innerHTML=html;
  pop.style.display='block';

  const rect=tile.getBoundingClientRect();
  let left=rect.right+8,top=rect.top;
  if(left+310>window.innerWidth)left=rect.left-310;
  if(top+pop.offsetHeight>window.innerHeight)top=window.innerHeight-pop.offsetHeight-8;
  pop.style.left=Math.max(4,left)+'px';
  pop.style.top=Math.max(4,top)+'px';
}

document.addEventListener('click',e=>{
  if(!e.target.closest('.popover')&&!e.target.closest('.tile')){
    document.getElementById('popover').style.display='none';
  }
});

// Export
function exportCSV(){
  let csv='Student ID,Name,Grade,Active Clashes,Placed,Requested,Clash Course Code,Clash Course,Lost Period,Lost Semester,Blocked By\n';
  for(const st of D.C){
    const totalSched=Object.keys(st.sc).length;
    const totalReq=totalSched+st.cl.length;
    for(const cl of st.cl){
      const blocker=getBlocker(st,cl[2],cl[3]);
      csv+=`${st.id},"${st.n}",${st.g},${countClashes(st)},${totalSched},${totalReq},${cl[0]},"${cl[1]}",${cl[2]},${halvesLabel(cl[3])},"${blocker?blocker.code+' '+blocker.title:'resolved'}"\n`;
    }
  }

}

function exportJSON(){
  const data=D.C.map(st=>({id:st.id,name:st.n,grade:st.g,
    clashes:st.cl.map(cl=>{const b=getBlocker(st,cl[2],cl[3]);return{code:cl[0],course:cl[1],period:cl[2],sem:halvesLabel(cl[3]),blocker:b?b.code:'resolved'}}),
    schedule:Object.entries(st.sc).map(([code,d])=>{const eff=getEffective(code,d[5]);return{code,title:d[0],period:eff?.p,halves:halvesLabel(eff?.h||d[2]),teacher:d[3],section:d[5]}})}));
  download('student_clashes.json',JSON.stringify(data,null,2),'application/json');
}

function exportChanges(){
  if(moves.size===0){showToast('No changes to export','info');return}
  const data={moves:[],timestamp:new Date().toISOString(),totalMoves:moves.size};
  for(const[key,m]of moves){
    data.moves.push({section:key,course:getTitle(m.code),from:{period:m.fromP,halves:halvesLabel(m.fromH)},
      to:{period:m.toP,halves:halvesLabel(m.toH)},
      impact:{current:m.impact.current,conflicted:m.impact.conflicted,potential:m.impact.potential,projected:m.impact.projected,cap:m.impact.cap}});
  }
  download('proposed_changes.json',JSON.stringify(data,null,2),'application/json');
  showToast('Changes exported','success');
}

function download(name,content,type){
  const blob=new Blob([content],{type});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=name;a.click();
  URL.revokeObjectURL(a.href);
}

// Zoom
const ZOOM_STEPS=[50,60,70,80,90,100];
document.getElementById('zoomIn').onclick=()=>{const i=ZOOM_STEPS.indexOf(currentZoom);if(i<ZOOM_STEPS.length-1)applyZoom(ZOOM_STEPS[i+1])};
document.getElementById('zoomOut').onclick=()=>{const i=ZOOM_STEPS.indexOf(currentZoom);if(i>0)applyZoom(ZOOM_STEPS[i-1])};
function applyZoom(z){currentZoom=z;document.getElementById('zoomWrap').style.transform='scale('+z/100+')';
  document.getElementById('zoomWrap').style.width=(10000/z)+'%';document.getElementById('zoomLvl').textContent=z+'%'}

function showToast(msg,type){
