  --font:'Segoe UI',system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#1a1412;--surface:#242018;--text:#e8e2db;--text2:#b0a598;--border:#3e362e;--maroon:#A0333E;--green:#2ecc71;--blue:#5dade2;--orange:#e67e22;--red:#e74c3c}}
:root[data-theme="dark"]{--bg:#1a1412;--surface:#242018;--text:#e8e2db;--text2:#b0a598;--border:#3e362e;--maroon:#A0333E;--green:#2ecc71;--blue:#5dade2;--orange:#e67e22;--red:#e74c3c}
:root[data-theme="light"]{--bg:#f5f2ee;--surface:#fff;--text:#1a1412;--text2:#5c4f44;--border:#d6cec6;--maroon:#7B1E28;--green:#1a7a3a;--blue:#1a5276;--orange:#b35900;--red:#c0392b}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--text);overflow:hidden;height:100vh;display:flex;flex-direction:column}

.toolbar{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;flex-shrink:0}
.toolbar h1{font-size:16px;color:var(--maroon);white-space:nowrap}
.toolbar .sep{width:1px;height:24px;background:var(--border)}
.toolbar select,.toolbar input{font:12px var(--font);padding:4px 8px;border:1px solid var(--border);border-radius:4px;background:var(--surface);color:var(--text)}
.toolbar label{font-size:11px;color:var(--text2);white-space:nowrap}
.toolbar .stat{font-size:12px;color:var(--text2)}
.toolbar .stat b{color:var(--maroon);font-size:14px}
.btn{font:12px var(--font);padding:5px 12px;border:1px solid var(--border);border-radius:4px;background:var(--surface);color:var(--text);cursor:pointer}
.btn:hover{border-color:var(--maroon);color:var(--maroon)}
.btn.active{background:var(--maroon);color:#fff;border-color:var(--maroon)}
.spacer{flex:1}

.tabs{display:flex;gap:2px;background:var(--surface);border-bottom:1px solid var(--border);padding:0 16px;flex-shrink:0}
.tab{padding:8px 16px;font-size:12px;cursor:pointer;border-bottom:2px solid transparent;color:var(--text2)}
.tab:hover{color:var(--text)}
.tab.active{color:var(--maroon);border-bottom-color:var(--maroon);font-weight:600}
.tab .badge{display:inline-block;background:var(--maroon);color:#fff;font-size:10px;padding:1px 6px;border-radius:8px;margin-left:4px}

.main{flex:1;overflow:hidden;display:flex;flex-direction:column}

/* ── Matrix View ── */
.matrix-wrap{flex:1;overflow:auto;position:relative}
.matrix-table{border-collapse:separate;border-spacing:0}
.matrix-table th,.matrix-table td{padding:0;text-align:center;font-size:7px;border:1px solid color-mix(in srgb, var(--border) 50%, transparent)}
.matrix-table thead th{position:sticky;top:0;z-index:2;background:var(--surface);writing-mode:vertical-lr;text-orientation:mixed;padding:4px 2px;font-weight:600;min-width:20px;max-width:20px;height:120px}
.matrix-table thead th.corner{z-index:3;writing-mode:horizontal-tb;min-width:auto}
.matrix-table tbody th{position:sticky;left:0;z-index:1;background:var(--surface);text-align:left;padding:2px 6px;white-space:nowrap;font-weight:400;max-width:160px;overflow:hidden;text-overflow:ellipsis}
.matrix-table tbody th.code-col{left:0;z-index:1;font-weight:700;min-width:40px;text-align:center}
.matrix-table tbody th.name-col{left:40px;z-index:1;min-width:120px}
.matrix-table td.cell{cursor:pointer;min-width:20px;max-width:20px;height:18px;transition:outline .1s}
.matrix-table td.cell:hover{outline:2px solid var(--maroon);outline-offset:-1px;z-index:5;position:relative}
.matrix-table td.diag{background:#333;color:#fff;font-weight:700}

/* ── Top Pairs View ── */
.pairs-wrap{flex:1;overflow:auto;padding:16px}
.pair-table{width:100%;border-collapse:collapse;font-size:13px}
.pair-table th{background:var(--maroon);color:#fff;padding:8px 12px;text-align:left;position:sticky;top:0;z-index:1}
.pair-table td{padding:6px 12px;border-bottom:1px solid var(--border)}
.pair-table tr:hover{background:color-mix(in srgb, var(--maroon) 5%, transparent)}
.pair-bar{display:inline-block;height:14px;border-radius:2px;vertical-align:middle;margin-right:6px}
.overlap-pct{font-size:11px;color:var(--text2)}

/* ── Department View ── */
.dept-wrap{flex:1;overflow:auto;padding:16px;display:flex;justify-content:center;align-items:flex-start}
.dept-table{border-collapse:collapse;font-size:12px}
.dept-table th{padding:8px;text-align:center;background:var(--surface);border:1px solid var(--border)}
.dept-table th.row-head{text-align:left;font-weight:600;white-space:nowrap}
.dept-table th.col-head{writing-mode:vertical-lr;text-orientation:mixed;height:140px;font-weight:600}
.dept-table td{padding:6px 8px;text-align:center;border:1px solid var(--border);font-weight:600;cursor:pointer;min-width:50px}
.dept-table td:hover{outline:2px solid var(--maroon);outline-offset:-1px}

/* ── Course Detail View ── */
.course-wrap{flex:1;overflow:auto;padding:16px}
.course-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:12px;max-width:800px}
.course-card h3{font-size:15px;color:var(--maroon);margin-bottom:8px}
.course-card .meta{font-size:12px;color:var(--text2);margin-bottom:12px}
.course-card .meta span{margin-right:16px}
.conflict-bar-row{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:12px;cursor:pointer;border-radius:4px;padding:4px 8px}
.conflict-bar-row:hover{background:color-mix(in srgb, var(--maroon) 8%, transparent)}
.conflict-bar-row .code{font-weight:700;min-width:40px}
.conflict-bar-row .title{min-width:180px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conflict-bar-row .bar-wrap{flex:1;height:14px;background:color-mix(in srgb, var(--border) 40%, transparent);border-radius:2px;overflow:hidden}
.conflict-bar-row .bar-fill{height:100%;border-radius:2px}
.conflict-bar-row .count{min-width:36px;text-align:right;font-weight:700}

/* ── Tooltip ── */
.tooltip{position:fixed;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:10px 14px;font-size:12px;box-shadow:0 4px 16px rgba(0,0,0,.15);pointer-events:none;z-index:100;max-width:300px;display:none}
.tooltip .tt-title{font-weight:700;color:var(--maroon);margin-bottom:4px}
.tooltip .tt-row{display:flex;justify-content:space-between;gap:12px}
.tooltip .tt-val{font-weight:700}

/* ── Dept colors ── */
.dept-Business{border-left:3px solid #e67e22}
.dept-Communication{border-left:3px solid #8e44ad}
.dept-Computer{border-left:3px solid #2980b9}

.dept-English{border-left:3px solid #2c3e50}
.dept-Humanities{border-left:3px solid #7f8c8d}
.dept-Mathematics{border-left:3px solid #16a085}
.dept-Physical{border-left:3px solid #d35400}
.dept-Science{border-left:3px solid #c0392b}
.dept-Social{border-left:3px solid #8e44ad}
.dept-Special{border-left:3px solid #95a5a6}

.dept-World{border-left:3px solid #2980b9}
.dept-Music{border-left:3px solid #f39c12}
</style>

function getOverlap(a, b) {
  if (a === b) return courseMap[a] ? courseMap[a].requests : 0;
  return (pairMap[a] && pairMap[a][b]) || 0;
}

// Heat color
function heatColor(count, max) {
  if (count === 0) return 'transparent';
  const ratio = count / max;
  let r, g, b;
  if (ratio <= 0.25) { r=255; g=255; b=Math.round(255-ratio*4*155); }
  else if (ratio <= 0.5) { r=255; g=Math.round(255-(ratio-0.25)*4*90); b=Math.round(100-(ratio-0.25)*4*100); }
  else if (ratio <= 0.75) { r=255; g=Math.round(165-(ratio-0.5)*4*100); b=0; }
  else { r=Math.round(255-(ratio-0.75)*4*75); g=Math.round(65-(ratio-0.75)*4*65); b=0; }
  return `rgb(${Math.max(0,Math.min(255,r))},${Math.max(0,Math.min(255,g))},${Math.max(0,Math.min(255,b))})`;
}

function textColorFor(bgColor) {
  if (bgColor === 'transparent') return 'var(--text)';
  const m = bgColor.match(/\d+/g);
  if (!m) return 'var(--text)';
  const lum = parseInt(m[0])*0.299 + parseInt(m[1])*0.587 + parseInt(m[2])*0.114;
  return lum < 140 ? '#fff' : '#000';
}

    tab.classList.add('active');
    activeTab = tab.dataset.tab;
    document.getElementById('view-matrix').style.display = activeTab === 'matrix' ? '' : 'none';
    document.getElementById('view-pairs').style.display = activeTab === 'pairs' ? '' : 'none';
    document.getElementById('view-dept').style.display = activeTab === 'dept' ? '' : 'none';
    document.getElementById('view-course').style.display = activeTab === 'course' ? '' : 'none';
    render();
  });
});

// ── Filter handlers ──
deptSel.addEventListener('change', e => { filterDept = e.target.value; render(); });
document.getElementById('filter-min').addEventListener('input', e => { filterMin = parseInt(e.target.value) || 0; render(); });
document.getElementById('search-box').addEventListener('input', e => { searchText = e.target.value; render(); });

// ── Tooltip ──
const tooltip = document.getElementById('tooltip');
function showTooltip(e, html) {
  tooltip.innerHTML = html;
  tooltip.style.display = 'block';
  const rect = tooltip.getBoundingClientRect();
  let x = e.clientX + 12, y = e.clientY + 12;
  if (x + rect.width > window.innerWidth) x = e.clientX - rect.width - 12;
  if (y + rect.height > window.innerHeight) y = e.clientY - rect.height - 12;
  tooltip.style.left = x + 'px';
  tooltip.style.top = y + 'px';
}
function hideTooltip() { tooltip.style.display = 'none'; }

// ══════════════════════════════════════════
// ── Matrix View ──
// ══════════════════════════════════════════
function renderMatrix() {
  const wrap = document.getElementById('view-matrix');
  const courses = getFilteredCourses();
  if (courses.length === 0) { wrap.innerHTML = '<p style="padding:24px;color:var(--text2)">No courses match filters.</p>'; return; }
  if (courses.length > 80) {
    wrap.innerHTML = '<p style="padding:24px;color:var(--text2)">Too many courses for matrix view (' + courses.length + '). Use Department or Search filter to narrow below 80.</p>';
    return;
  }

  const max = DATA.stats.maxOverlap;
  let html = '<table class="matrix-table"><thead><tr><th class="corner" style="min-width:40px">Code</th><th class="corner" style="min-width:120px">Course</th>';
  courses.forEach(c => {
    const col = deptColors[c.dept] || '#888';
    html += `<th style="border-left:2px solid ${col}">${c.code}<br><span style="font-weight:400;font-size:6px">${c.title.substring(0,18)}</span></th>`;
  });
  html += '</tr></thead><tbody>';

  courses.forEach(row => {
    const deptKey = row.dept.split(' ')[0];
    html += `<tr><th class="code-col dept-${deptKey}">${row.code}</th><th class="name-col dept-${deptKey}">${row.title.substring(0,25)}</th>`;
    courses.forEach(col => {
      if (row.code === col.code) {
        html += `<td class="cell diag" data-r="${row.code}" data-c="${col.code}">${row.requests}</td>`;
      } else {
        const v = getOverlap(row.code, col.code);
        if (v > 0 && v >= filterMin) {
          const bg = heatColor(v, max);
          const fg = textColorFor(bg);
          html += `<td class="cell" style="background:${bg};color:${fg}" data-r="${row.code}" data-c="${col.code}">${v}</td>`;
        } else {
          html += `<td class="cell" data-r="${row.code}" data-c="${col.code}"></td>`;
        }
      }
    });
    html += '</tr>';
  });

  html += '</tbody></table>';
  wrap.innerHTML = html;

  // Cell hover
  wrap.querySelectorAll('.cell').forEach(td => {
    td.addEventListener('mouseenter', e => {
      const r = td.dataset.r, c = td.dataset.c;
      const cr = courseMap[r], cc = courseMap[c];
      if (!cr || !cc) return;
      if (r === c) {
        showTooltip(e, `<div class="tt-title">${r} ${cr.title}</div><div class="tt-row"><span>Requests:</span><span class="tt-val">${cr.requests}</span></div><div class="tt-row"><span>Sections:</span><span class="tt-val">${cr.sections}</span></div><div class="tt-row"><span>Periods:</span><span class="tt-val">${cr.periods.join(', ')}</span></div><div class="tt-row"><span>Department:</span><span class="tt-val">${cr.dept}</span></div>`);
      } else {
        const v = getOverlap(r, c);
        const minReq = Math.min(cr.requests, cc.requests);
        const pct = minReq > 0 ? (v / minReq * 100).toFixed(1) : '0.0';
        const samePeriod = cr.periods.filter(p => cc.periods.includes(p));
        showTooltip(e, `<div class="tt-title">${r} ${cr.title}</div><div class="tt-title" style="margin-bottom:8px">× ${c} ${cc.title}</div><div class="tt-row"><span>Shared Students:</span><span class="tt-val">${v}</span></div><div class="tt-row"><span>Overlap:</span><span class="tt-val">${pct}%</span></div><div class="tt-row"><span>Same Periods:</span><span class="tt-val ${samePeriod.length > 0 ? 'color:var(--red)' : ''}">${samePeriod.length > 0 ? samePeriod.join(', ') + ' (conflict!)' : 'None (safe)'}</span></div>`);
      }
    });
    td.addEventListener('mouseleave', hideTooltip);
    td.addEventListener('click', () => {
      const code = td.dataset.r !== td.dataset.c ? td.dataset.r : td.dataset.r;
      selectedCourse = code;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelector('[data-tab="course"]').classList.add('active');
      activeTab = 'course';
      document.getElementById('view-matrix').style.display = 'none';
      document.getElementById('view-course').style.display = '';
      render();
    });
  });
}

// ══════════════════════════════════════════
// ── Top Pairs View ──
// ══════════════════════════════════════════
function renderPairs() {
  const wrap = document.getElementById('view-pairs');
  const max = DATA.stats.maxOverlap;
  const filtered = DATA.pairs.filter(([a, b, cnt]) => {
    if (cnt < filterMin) return false;
    const ca = courseMap[a], cb = courseMap[b];
    if (!ca || !cb) return false;
    if (filterDept !== 'all' && ca.dept !== filterDept && cb.dept !== filterDept) return false;
    if (searchText) {
      const q = searchText.toLowerCase();
      if (!a.includes(q) && !b.includes(q) && !ca.title.toLowerCase().includes(q) && !cb.title.toLowerCase().includes(q)) return false;
    }
    return true;
  });

  document.getElementById('pairs-badge').textContent = filtered.length.toLocaleString();

  let html = '<table class="pair-table"><thead><tr><th>#</th><th>Course A</th><th>Course B</th><th>Shared Students</th><th>Overlap %</th><th>Same Periods</th></tr></thead><tbody>';

  filtered.slice(0, 500).forEach(([a, b, cnt], i) => {
    const ca = courseMap[a], cb = courseMap[b];
    const minReq = Math.min(ca.requests, cb.requests);
    const pct = minReq > 0 ? (cnt / minReq * 100).toFixed(1) : '0.0';
    const samePeriods = ca.periods.filter(p => cb.periods.includes(p));
    const bg = heatColor(cnt, max);
    const barW = (cnt / max * 100).toFixed(1);

    html += `<tr>
      <td>${i+1}</td>
      <td><b>${a}</b> ${ca.title} <span class="overlap-pct">(${ca.dept})</span></td>
      <td><b>${b}</b> ${cb.title} <span class="overlap-pct">(${cb.dept})</span></td>
      <td><span class="pair-bar" style="width:${barW}%;background:${bg}"></span><b>${cnt}</b></td>
      <td>${pct}%</td>
      <td style="${samePeriods.length > 0 ? 'color:var(--red);font-weight:700' : 'color:var(--green)'}">${samePeriods.length > 0 ? samePeriods.join(', ') : 'None'}</td>
    </tr>`;
  });

  html += '</tbody></table>';
  if (filtered.length > 500) html += `<p style="padding:12px;color:var(--text2)">Showing 500 of ${filtered.length} pairs. Use filters to narrow.</p>`;
  wrap.innerHTML = html;

  // Click to course detail
  wrap.querySelectorAll('tr').forEach(tr => {
    tr.addEventListener('click', () => {
      const b = tr.querySelector('b');
      if (b) {
        selectedCourse = b.textContent;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelector('[data-tab="course"]').classList.add('active');
        activeTab = 'course';
        document.getElementById('view-pairs').style.display = 'none';
        document.getElementById('view-course').style.display = '';
        render();
      }
    });
  });
}

// ══════════════════════════════════════════
// ── Department View ──
// ══════════════════════════════════════════
function renderDept() {
  const wrap = document.getElementById('view-dept');
  const depts = DATA.depts;
  const dm = DATA.deptMatrix;
  const vals = Object.values(dm).filter(v => v > 0);
  const dMax = vals.length > 0 ? Math.max(...vals) : 1;

  let html = '<table class="dept-table"><thead><tr><th></th>';
  depts.forEach(d => {
    html += `<th class="col-head">${d}</th>`;
  });
  html += '</tr></thead><tbody>';

  depts.forEach(d1 => {
    html += `<tr><th class="row-head">${d1}</th>`;
    depts.forEach(d2 => {
      const v = dm[d1 + '|' + d2] || 0;
      if (v > 0) {
        const bg = heatColor(v, dMax);
        const fg = textColorFor(bg);
        html += `<td style="background:${bg};color:${fg}" data-d1="${d1}" data-d2="${d2}">${v.toLocaleString()}</td>`;
      } else {
        html += `<td data-d1="${d1}" data-d2="${d2}"></td>`;
      }
    });
    html += '</tr>';
  });
  html += '</tbody></table>';
  wrap.innerHTML = html;

  // Click to filter by department
  wrap.querySelectorAll('td').forEach(td => {
    td.addEventListener('click', () => {
      const d = td.dataset.d1;
      if (d) {
        filterDept = d;
        deptSel.value = d;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelector('[data-tab="pairs"]').classList.add('active');
        activeTab = 'pairs';
        document.getElementById('view-dept').style.display = 'none';
        document.getElementById('view-pairs').style.display = '';
        render();
      }
    });
    td.addEventListener('mouseenter', e => {
      const d1 = td.dataset.d1, d2 = td.dataset.d2;
      const v = dm[d1 + '|' + d2] || 0;
      if (d1 && d2) showTooltip(e, `<div class="tt-title">${d1} × ${d2}</div><div class="tt-row"><span>Total Overlaps:</span><span class="tt-val">${v.toLocaleString()}</span></div><div style="font-size:11px;color:var(--text2);margin-top:4px">Click to see course pairs</div>`);
    });
    td.addEventListener('mouseleave', hideTooltip);
  });
}

// ══════════════════════════════════════════
// ── Course Detail View ──
// ══════════════════════════════════════════
function renderCourseDetail() {
  const wrap = document.getElementById('view-course');
  if (!selectedCourse || !courseMap[selectedCourse]) {
    wrap.innerHTML = '<p style="padding:24px;color:var(--text2)">Click a course in the matrix, pairs, or department view to see its conflict profile.</p>';
    return;
  }

  const c = courseMap[selectedCourse];
  const pairs = [];
  DATA.pairs.forEach(([a, b, cnt]) => {
    if (a === selectedCourse) pairs.push({ code: b, count: cnt });
    else if (b === selectedCourse) pairs.push({ code: a, count: cnt });
  });
  pairs.sort((a, b) => b.count - a.count);

  const totalOverlaps = pairs.reduce((s, p) => s + p.count, 0);
  const maxPair = pairs.length > 0 ? pairs[0].count : 0;

  let html = `<div class="course-card">
    <h3>${c.code} ${c.title}</h3>
    <div class="meta">
      <span>Department: <b>${c.dept}</b></span>
      <span>Sections: <b>${c.sections}</b></span>
      <span>Periods: <b>${c.periods.join(', ')}</b></span>
      <span>Requests: <b>${c.requests}</b></span>
      <span>Conflict Pairs: <b>${pairs.length}</b></span>
      <span>Total Overlaps: <b>${totalOverlaps.toLocaleString()}</b></span>
    </div>`;

  if (pairs.length === 0) {
    html += '<p style="color:var(--text2)">No conflict pairs found for this course.</p>';
  } else {
    html += `<div style="margin-bottom:8px;font-size:12px;color:var(--text2)">Top conflicts — courses sharing the most students with ${c.code}:</div>`;
    pairs.slice(0, 60).forEach(p => {
      const pc = courseMap[p.code];
      if (!pc) return;
      const barW = maxPair > 0 ? (p.count / maxPair * 100).toFixed(1) : 0;
      const bg = heatColor(p.count, DATA.stats.maxOverlap);
      const samePeriods = c.periods.filter(per => pc.periods.includes(per));
      const warn = samePeriods.length > 0 ? ` <span style="color:var(--red);font-size:10px">Same period: ${samePeriods.join(',')}</span>` : '';

      html += `<div class="conflict-bar-row" data-code="${p.code}">
        <span class="code">${p.code}</span>
        <span class="title">${pc.title}${warn}</span>
        <span class="bar-wrap"><span class="bar-fill" style="width:${barW}%;background:${bg}"></span></span>
        <span class="count">${p.count}</span>
      </div>`;
    });
    if (pairs.length > 60) html += `<p style="font-size:11px;color:var(--text2);margin-top:8px">Showing 60 of ${pairs.length} pairs.</p>`;
  }

  html += '</div>';
  wrap.innerHTML = html;

  // Click to drill into another course
  wrap.querySelectorAll('.conflict-bar-row').forEach(row => {
    row.addEventListener('click', () => {
      selectedCourse = row.dataset.code;
      render();
    });
  });
}

// ── Export ──
document.getElementById('btn-export').addEventListener('click', () => {
  let csv = 'Course A,Course A Name,Dept A,Course B,Course B Name,Dept B,Shared Students,Overlap %\n';
  DATA.pairs.forEach(([a, b, cnt]) => {
    const ca = courseMap[a], cb = courseMap[b];
    if (!ca || !cb) return;
    const minReq = Math.min(ca.requests, cb.requests);
    const pct = minReq > 0 ? (cnt / minReq * 100).toFixed(1) : '0.0';
    csv += `${a},"${ca.title}","${ca.dept}",${b},"${cb.title}","${cb.dept}",${cnt},${pct}%\n`;
  });
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'conflict_matrix_2026_27.csv'; a.click();
  URL.revokeObjectURL(url);
});

// ── Render dispatcher ──
function render() {
  if (activeTab === 'matrix') renderMatrix();
  else if (activeTab === 'pairs') renderPairs();
  else if (activeTab === 'dept') renderDept();
  else if (activeTab === 'course') renderCourseDetail();
}

render();
</script>
