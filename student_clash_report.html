.toolbar h1 { font-size: 16px; font-weight: 700; letter-spacing: 0.02em; white-space: nowrap; }

}
.filter-bar input[type="search"] { width: 200px; }
.filter-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }

.summary-cards {

  border-bottom: 1px solid var(--border);
}
.summary-card {
  background: var(--surface); border-radius: 6px; padding: 12px 16px;
  border-left: 4px solid var(--maroon);
}
.summary-card .label { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.05em; }
.summary-card .value { font-size: 24px; font-weight: 700; color: var(--text); margin-top: 2px; }
.summary-card .sub { font-size: 11px; color: var(--text2); margin-top: 2px; }
.summary-card.red { border-left-color: var(--red); }
.summary-card.green { border-left-color: var(--green); }
.summary-card.amber { border-left-color: var(--amber); }

.content { padding: 0 20px 40px; }

.student-list { margin-top: 12px; }

.student-card {

.student-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
.student-card.expanded { box-shadow: 0 2px 12px rgba(0,0,0,0.12); }

.student-header {

.student-header:hover { background: var(--surface2); }
.student-header .expand-icon {

}
.student-card.expanded .expand-icon { transform: rotate(90deg); }
.student-header .name { font-weight: 600; font-size: 13px; }
.student-header .grade-badge {

}
.student-header .clash-badge {

// Populate summary cards
function renderSummary() {
  const g12 = D.students.filter(s => s.g === 12);
  const g11 = D.students.filter(s => s.g === 11);
  const g10 = D.students.filter(s => s.g === 10);
  const g9 = D.students.filter(s => s.g === 9);
  const multi = D.students.filter(s => s.cc >= 2);
  document.getElementById('summary-cards').innerHTML = `
    <div class="summary-card red"><div class="label">Total Clashes</div><div class="value">${D.stats.tc}</div><div class="sub">${D.stats.sa} students affected</div></div>
    <div class="summary-card green"><div class="label">Placement Rate</div><div class="value">${D.stats.pr}%</div><div class="sub">${D.stats.pl.toLocaleString()} / ${D.stats.rq.toLocaleString()} placed</div></div>
    <div class="summary-card amber"><div class="label">Multi-Clash</div><div class="value">${multi.length}</div><div class="sub">Students with 2+ clashes</div></div>
    <div class="summary-card"><div class="label">Grade 12</div><div class="value">${g12.reduce((a,s)=>a+s.cc,0)}</div><div class="sub">${g12.length} students</div></div>
    <div class="summary-card"><div class="label">Grade 11</div><div class="value">${g11.reduce((a,s)=>a+s.cc,0)}</div><div class="sub">${g11.length} students</div></div>
    <div class="summary-card blue"><div class="label">Grade 10</div><div class="value">${g10.reduce((a,s)=>a+s.cc,0)}</div><div class="sub">${g10.length} students</div></div>
  `;
  document.getElementById('stat-clashes').textContent = D.stats.tc;
  document.getElementById('stat-students').textContent = D.stats.sa + ' / ' + D.stats.ts;
  document.getElementById('stat-rate').textContent = D.stats.pr + '%';
}

// Populate filter dropdowns
function populateFilters() {
  const depts = new Set();
  const courses = new Map();
  D.students.forEach(s => {
    s.u.forEach(u => {
      const dept = D.depts[u[0]] || 'Unknown';
      depts.add(dept);
      courses.set(u[0], u[1]);
    });
  });
  const deptSel = document.getElementById('filter-dept');
  [...depts].sort().forEach(d => {
    const o = document.createElement('option');
    o.value = d; o.textContent = d;
    deptSel.appendChild(o);
  });
  const courseSel = document.getElementById('filter-course');
  [...courses.entries()].sort((a,b) => a[1].localeCompare(b[1])).forEach(([code, title]) => {
    const o = document.createElement('option');
    o.value = code; o.textContent = `${code} ${title}`;
    courseSel.appendChild(o);
  });
}

function getFiltered() {
  const grade = document.getElementById('filter-grade').value;
  const clashes = document.getElementById('filter-clashes').value;
  const dept = document.getElementById('filter-dept').value;
  const course = document.getElementById('filter-course').value;
  const search = document.getElementById('search').value.toLowerCase().trim();

  return D.students.filter(s => {
    if (grade !== 'all' && s.g !== parseInt(grade)) return false;
    if (clashes !== 'all') {
      const min = parseInt(clashes);
      if (clashes === '1' && s.cc !== 1) return false;
      if (clashes !== '1' && s.cc < min) return false;
    }
    if (dept !== 'all') {
      if (!s.u.some(u => (D.depts[u[0]] || '') === dept)) return false;
    }
    if (course !== 'all') {
      if (!s.u.some(u => u[0] === course)) return false;
    }
    if (search) {
      if (!s.n.toLowerCase().includes(search) && !s.p.includes(search)) return false;
    }
    return true;
  });
}

function semLabel(h) {
  return h === 'FY' ? 'Full-Year' : h === 'S1' ? 'Fall' : 'Spring';
}

function renderScheduleGrid(student) {
  // Build lookup: period -> [{course data, type}]
  const grid = {};
  PERIODS.forEach(p => { grid[p] = { S1: [], S2: [] }; });

  // Scheduled courses
  student.s.forEach(sc => {
    const entry = { code: sc[0], title: sc[1], halves: sc[3], teacher: sc[4], room: sc[5], type: 'scheduled' };
    if (sc[3] === 'FY') {
      grid[sc[2]].S1.push(entry);
      grid[sc[2]].S2.push({...entry});
    } else {
      grid[sc[2]][sc[3]].push(entry);
    }
  });

  // Clashed courses (show where they WERE)
  const conflictCodes = new Set();
  student.u.forEach(u => {
    u[4].forEach(cc => conflictCodes.add(cc));
    const entry = { code: u[0], title: u[1], halves: u[3], type: 'clashed' };
    if (u[3] === 'FY') {
      grid[u[2]].S1.push(entry);
      grid[u[2]].S2.push({...entry});
    } else {
      grid[u[2]][u[3]].push(entry);
    }
  });

  let html = '<div class="schedule-grid">';
  // Header row
  html += '<div class="sg-header"></div>';
  PERIODS.forEach(p => html += `<div class="sg-header">Period ${p}</div>`);

  // S1 row
  html += '<div class="sg-label">S1<br>Fall</div>';
  PERIODS.forEach(p => {
    html += '<div class="sg-cell">';
    grid[p].S1.forEach(e => {
      const cls = e.type === 'clashed' ? 'clashed' : (conflictCodes.has(e.code) ? 'conflict-source' : 'scheduled');
      html += `<div class="sg-course ${cls}">`;
      html += `<span class="c-code">${e.code}</span> `;
      html += `<span class="c-title">${e.title}</span>`;
      if (e.teacher) html += `<div class="c-teacher">${e.teacher}</div>`;
      if (e.room && e.room !== 'TBD') html += `<div class="c-room">${e.room}</div>`;
      html += '</div>';
    });
    html += '</div>';
  });

  // S2 row
  html += '<div class="sg-label">S2<br>Spring</div>';
  PERIODS.forEach(p => {
    html += '<div class="sg-cell">';
    grid[p].S2.forEach(e => {
      const cls = e.type === 'clashed' ? 'clashed' : (conflictCodes.has(e.code) ? 'conflict-source' : 'scheduled');
      html += `<div class="sg-course ${cls}">`;
      html += `<span class="c-code">${e.code}</span> `;
      html += `<span class="c-title">${e.title}</span>`;
      if (e.teacher) html += `<div class="c-teacher">${e.teacher}</div>`;
      if (e.room && e.room !== 'TBD') html += `<div class="c-room">${e.room}</div>`;
      html += '</div>';
    });
    html += '</div>';
  });

  html += '</div>';

  // Legend
  html += '<div style="display:flex;gap:16px;margin-bottom:12px;font-size:11px;">';
  html += '<span style="display:flex;align-items:center;gap:4px;"><span style="width:12px;height:12px;border-radius:2px;background:var(--green-bg);border-left:3px solid var(--green);"></span> Scheduled</span>';
  html += '<span style="display:flex;align-items:center;gap:4px;"><span style="width:12px;height:12px;border-radius:2px;background:var(--amber-bg);border-left:3px solid var(--amber);"></span> Conflicts with clashed course</span>';
  html += '<span style="display:flex;align-items:center;gap:4px;"><span style="width:12px;height:12px;border-radius:2px;background:var(--red-bg);border-left:3px solid var(--red);text-decoration:line-through;"></span> Unscheduled (clashed)</span>';
  html += '</div>';

  return html;
}

function renderClashDetails(student) {
  if (!student.u.length) return '';
  let html = '<div class="clash-details">';
  html += `<h4>⚠ ${student.u.length} Unscheduled Course${student.u.length > 1 ? 's' : ''} (Schedule Conflicts)</h4>`;

  student.u.forEach(u => {
    const conflictNames = u[4].map(cc => {
      const sc = student.s.find(s => s[0] === cc);
      return sc ? `${cc} ${sc[1]}` : cc;
    });
    html += '<div class="clash-item">';
    html += `<div class="clash-title">${u[0]} ${u[1]}</div>`;
    html += `<div class="clash-reason">Was at <strong>Period ${u[2]}</strong> (${semLabel(u[3])}) — blocked by: <strong>${conflictNames.join(', ')}</strong></div>`;

    // Alternative sections
    if (u[5].length) {
      html += '<div class="alt-label">Available Sections</div>';
      html += '<table class="alt-table"><thead><tr><th>Period</th><th>Semester</th><th>Teacher</th><th>Sec#</th><th>Enrollment</th><th>Status</th></tr></thead><tbody>';
      u[5].forEach(alt => {
        const avail = alt[6];
        const pct = alt[5] > 0 ? Math.round(alt[4] / alt[5] * 100) : 0;
        const barW = Math.min(pct, 100);
        const cls = avail ? 'available' : 'blocked';
        const overCls = pct >= 100 ? ' over' : '';
        html += `<tr class="${cls}">`;
        html += `<td>Period ${alt[0]}</td>`;
        html += `<td>${semLabel(alt[1])}</td>`;
        html += `<td>${alt[2]}</td>`;
        html += `<td>#${alt[3]}</td>`;
        html += `<td><span class="fill-bar${overCls}" style="width:${barW}px;"></span>${alt[4]}/${alt[5]}</td>`;
        html += `<td>${avail ? '<span style="color:var(--green);font-weight:600;">Open</span>' : '<span style="color:var(--red);">Blocked</span>'}</td>`;
        html += '</tr>';
      });
      html += '</tbody></table>';
    }
    html += '</div>';
  });

  html += '</div>';
  return html;
}

function renderStudentCard(student, idx) {
  const clashCourses = student.u.map(u => `${u[0]} ${u[1]}`).join(', ');
  return `
    <div class="student-card" id="card-${idx}" data-idx="${idx}">
      <div class="student-header" onclick="toggleCard(${idx})">
        <span class="expand-icon">▶</span>
        <span class="name">${student.n}</span>
        <span class="grade-badge">Grade ${student.g}</span>
        <span class="clash-badge">⚠ ${student.cc} clash${student.cc > 1 ? 'es' : ''}</span>
        <span class="courses-summary">
          <span class="sched">✔ ${student.s.length} scheduled</span>
          <span class="unsched">✖ ${student.cc} unscheduled</span>
          <span style="color:var(--text3);">${student.tr} requested</span>
        </span>
        <span class="id">#${student.p}</span>
      </div>
      <div class="student-body" id="body-${idx}">
        ${renderScheduleGrid(student)}
        ${renderClashDetails(student)}
      </div>
    </div>
  `;
}

let currentFiltered = [];

function renderList() {
  currentFiltered = getFiltered();
  const list = document.getElementById('student-list');

  if (!currentFiltered.length) {
    list.innerHTML = '<div class="no-results">No students match the current filters.</div>';
  } else {
    list.innerHTML = currentFiltered.map((s, i) => renderStudentCard(s, i)).join('');
  }
  document.getElementById('stat-showing').textContent = currentFiltered.length;
  document.getElementById('result-count').textContent = `${currentFiltered.length} student${currentFiltered.length !== 1 ? 's' : ''} — ${currentFiltered.reduce((a,s) => a+s.cc, 0)} total clashes`;
}

function toggleCard(idx) {
  const card = document.getElementById('card-' + idx);
  card.classList.toggle('expanded');
}

// Expand / collapse all
document.getElementById('btn-expand-all').onclick = () => {
  document.querySelectorAll('.student-card').forEach(c => c.classList.add('expanded'));
};
document.getElementById('btn-collapse-all').onclick = () => {
  document.querySelectorAll('.student-card').forEach(c => c.classList.remove('expanded'));
};

// Filters
['filter-grade','filter-clashes','filter-dept','filter-course'].forEach(id => {
  document.getElementById(id).addEventListener('change', renderList);
});
document.getElementById('search').addEventListener('input', renderList);
document.getElementById('btn-clear').onclick = () => {
  ['filter-grade','filter-clashes','filter-dept','filter-course'].forEach(id => {
    document.getElementById(id).value = 'all';
  });
  document.getElementById('search').value = '';
  renderList();
};

// Export CSV
document.getElementById('btn-export-csv').onclick = () => {
  const rows = [['Student_ID','Name','Grade','Clashes','Clashed_Course_Code','Clashed_Course','Lost_Period','Lost_Semester','Blocked_By','Scheduled_Courses']];
  currentFiltered.forEach(s => {
    s.u.forEach(u => {
      rows.push([
        s.p, s.n, s.g, s.cc, u[0], u[1], u[2], semLabel(u[3]),
        u[4].join(';'),
        s.s.map(sc => `${sc[0]}(Per${sc[2]}/${sc[3]})`).join(';')
      ]);
    });
  });
  const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type: 'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'student_clash_report_2026-27.csv';
  a.click();
  showToast('CSV exported', 'info');
};

// Export JSON
document.getElementById('btn-export-json').onclick = () => {
  const data = currentFiltered.map(s => ({
    student_id: s.p, name: s.n, grade: s.g,
    scheduled: s.s.map(sc => ({ code: sc[0], title: sc[1], period: sc[2], semester: sc[3], teacher: sc[4], room: sc[5] })),
    unscheduled: s.u.map(u => ({
      code: u[0], title: u[1], lost_period: u[2], lost_semester: u[3],
      blocked_by: u[4],
      alt_sections: u[5].map(a => ({ period: a[0], semester: a[1], teacher: a[2], section: a[3], enrolled: a[4], cap: a[5], available: !!a[6] }))
    }))
  }));
  const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'student_clash_report_2026-27.json';
  a.click();
  showToast('JSON exported', 'info');
};

// Zoom
const ZOOM_STEPS = [50, 60, 70, 80, 90, 100];
let zoomLevel = 100;
function applyZoom(level) {
  zoomLevel = level;
  const content = document.getElementById('main-content');
  const scale = level / 100;
  content.style.transform = `scale(${scale})`;
  content.style.transformOrigin = 'top left';
  content.style.width = (100 / scale) + '%';
  document.getElementById('zoom-label').textContent = level + '%';
}
document.getElementById('zoom-out').onclick = () => {
  const idx = ZOOM_STEPS.indexOf(zoomLevel);
  if (idx > 0) applyZoom(ZOOM_STEPS[idx - 1]);
};
document.getElementById('zoom-in').onclick = () => {
  const idx = ZOOM_STEPS.indexOf(zoomLevel);
  if (idx < ZOOM_STEPS.length - 1) applyZoom(ZOOM_STEPS[idx + 1]);
};
document.getElementById('zoom-fit').onclick = () => {
  const w = window.innerWidth;
  const best = ZOOM_STEPS.reduce((a, b) => Math.abs(b - (w / 14)) < Math.abs(a - (w / 14)) ? b : a);
  applyZoom(Math.min(best, 100));
};

// Toast
function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type === 'info' ? ' info' : '');
  setTimeout(() => t.className = 'toast', 2500);
}

// Init
renderSummary();
populateFilters();
renderList();
</script>
