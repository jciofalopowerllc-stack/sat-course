* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: var(--font); background: var(--bg); color: var(--text); }

.toolbar {
  position: sticky; top: 0; z-index: 100;
  background: var(--header-bg);
  color: var(--header-text);
  padding: 10px 20px;
  display: flex; align-items: center; gap: 16px;
  flex-wrap: wrap;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}
.toolbar h1 { font-size: 16px; font-weight: 700; letter-spacing: 0.02em; white-space: nowrap; }
.toolbar .stats { font-size: 12px; opacity: 0.85; display: flex; gap: 14px; flex-wrap: wrap; }
.toolbar .stats span { white-space: nowrap; }
.toolbar .actions { margin-left: auto; display: flex; gap: 8px; }
.btn {
  padding: 6px 14px; border: none; border-radius: 4px;
  font-size: 12px; font-weight: 600; cursor: pointer;
  transition: all 0.15s;
}
.btn-save { background: var(--amber); color: #fff; }
.btn-save:hover { background: #e67e22; }
.btn-commit { background: var(--green); color: #fff; }
.btn-commit:hover { background: #219a52; }
.btn-reset { background: var(--text3); color: #fff; }
.btn-reset:hover { background: var(--text2); }
.btn-export { background: var(--blue); color: #fff; }
.btn-export:hover { background: #2471a3; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

.filter-bar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 8px 20px;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  font-size: 12px;
}
.filter-bar label { color: var(--text2); font-weight: 600; }
.filter-bar select, .filter-bar input {
  padding: 4px 8px; border: 1px solid var(--border); border-radius: 4px;
  font-size: 12px; background: var(--surface); color: var(--text);
}
.legend { display: flex; gap: 12px; margin-left: auto; align-items: center; }
.legend-item { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--text2); }
.legend-swatch {
  width: 14px; height: 14px; border-radius: 2px; border: 1px solid var(--border);
}

.board-wrap {
  overflow-x: auto; overflow-y: auto;
  max-height: calc(100vh - 110px);
  padding: 0;
}
.board {
  display: grid;
  grid-template-columns: 160px 26px repeat(21, minmax(100px, 1fr));
  min-width: 2400px;
  border-collapse: collapse;
}

.cell {
  border: 1px solid var(--border2);
  padding: 2px;
  min-height: 52px;
  font-size: 11px;
  position: relative;
  transition: background 0.15s;
}
.cell-header {
  background: var(--header-bg);
  color: var(--header-text);
  font-weight: 700;
  font-size: 12px;
  display: flex; align-items: center; justify-content: center;
  text-align: center;
  border-color: var(--header-bg);
  min-height: 32px;
}
.cell-subheader {
  background: var(--subheader-bg);
  color: var(--header-text);
  font-weight: 600;
  font-size: 11px;
  display: flex; align-items: center; justify-content: center;
  text-align: center;
  border-color: var(--subheader-bg);
  min-height: 26px;
}
.cell-teacher {
  background: var(--surface);
  font-weight: 600;
  font-size: 12px;
  display: flex; align-items: center;
  padding: 4px 6px;
  position: sticky; left: 0; z-index: 10;
  border-right: 2px solid var(--border);
}
.cell-dept {
  background: var(--surface2);
  font-size: 10px;
  color: var(--text2);
  display: flex; align-items: center; justify-content: center;
  text-align: center;
  writing-mode: vertical-lr;
  text-orientation: mixed;
  position: sticky; left: 160px; z-index: 10;
  border-right: 2px solid var(--border);
}
.cell-slot {
  background: var(--surface);
  position: relative;
  vertical-align: top;
  overflow: visible;
}
.cell-slot.drop-target { background: var(--blue-bg); outline: 2px dashed var(--blue); }
.cell-slot.drop-invalid { background: var(--red-bg); outline: 2px dashed var(--red); }

.course-card {
  border-radius: 4px;
  padding: 3px 5px;
  font-size: 10px;
  line-height: 1.3;
  cursor: default;
  min-height: 44px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  position: relative;
  transition: all 0.15s;
  border: 2px solid transparent;
}
.course-card.singleton {
  background: var(--red-cell);
  color: #fff;
  cursor: grab;
  border-color: #c0392b;
  font-weight: 600;
}
.course-card.singleton:active { cursor: grabbing; }
.course-card.singleton.dragging {
  opacity: 0.4;
  transform: scale(0.95);
}
.course-card.singleton.green {
  background: var(--green-cell);
  border-color: var(--green);
}
.course-card.singleton.locked {
  background: var(--locked-bg);
  border-color: var(--locked-border);
  color: var(--text);
  cursor: default;
}
.course-card.singleton.locked::after {
  content: '\1F512';
  position: absolute; top: 2px; right: 3px; font-size: 10px;
}
.course-card.regular {
  background: var(--green-bg);
  color: var(--text);
  border-color: var(--border);
  font-size: 9px;
  min-height: 36px;
  opacity: 0.7;
}
.course-card .code { font-weight: 700; font-size: 11px; }
.course-card .title { font-size: 9px; line-height: 1.2; }
.course-card .teacher-name { font-size: 8px; opacity: 0.85; font-style: italic; }
.course-card .enroll { font-size: 8px; position: absolute; bottom: 2px; right: 4px; opacity: 0.8; }

.ghost-card {
  position: fixed;
  pointer-events: none;
  z-index: 1000;
  border-radius: 4px;
  padding: 4px 6px;
  background: var(--red-cell);
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  box-shadow: 0 4px 16px var(--drag-shadow);
  opacity: 0.92;
  transform: translate(-50%, -50%);
  min-width: 90px;
  text-align: center;
}

/* Popover */
.popover-overlay {
  display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  z-index: 200; background: rgba(0,0,0,0.3);
}
.popover-overlay.active { display: block; }
.popover {
  position: fixed; z-index: 201;
  background: var(--popover-bg);
  border: 1px solid var(--popover-border);
  border-radius: 8px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.2);
  max-width: 520px; width: 90vw;
  max-height: 80vh; overflow-y: auto;
  padding: 0;
  font-size: 12px;
}
.popover .pop-header {
  background: var(--header-bg);
  color: var(--header-text);
  padding: 12px 16px;
  border-radius: 8px 8px 0 0;
  display: flex; justify-content: space-between; align-items: center;
}
.popover .pop-header h3 { font-size: 14px; }
.popover .pop-close { background: none; border: none; color: var(--header-text); font-size: 18px; cursor: pointer; padding: 0 4px; }
.popover .pop-body { padding: 12px 16px; }
.popover .pop-section { margin-bottom: 12px; }
.popover .pop-section h4 {
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--text3); margin-bottom: 6px; border-bottom: 1px solid var(--border2); padding-bottom: 3px;
}
.popover table { width: 100%; border-collapse: collapse; font-size: 11px; }
.popover th { text-align: left; padding: 3px 6px; background: var(--surface2); color: var(--text2); font-weight: 600; border: 1px solid var(--border2); }
.popover td { padding: 3px 6px; border: 1px solid var(--border2); }
.popover .conflict-tag { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 10px; font-weight: 600; }
.popover .conflict-tag.yes { background: var(--red-bg); color: var(--red); }
.popover .conflict-tag.no { background: var(--green-bg); color: var(--green); }
.popover .pop-actions { display: flex; gap: 8px; margin-top: 12px; justify-content: flex-end; }

/* Toast */
.toast {
  position: fixed; bottom: 20px; right: 20px; z-index: 300;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 6px; padding: 10px 16px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.15);
  font-size: 13px; font-weight: 600;
  transform: translateY(80px); opacity: 0;
  transition: all 0.3s;
}
.toast.show { transform: translateY(0); opacity: 1; }
.toast.success { border-color: var(--green); color: var(--green); }
.toast.error { border-color: var(--red); color: var(--red); }
.toast.info { border-color: var(--blue); color: var(--blue); }

/* Conflict summary panel */
.conflict-panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  margin: 12px 20px;
  padding: 12px 16px;
  font-size: 12px;
}
.conflict-panel h3 { font-size: 13px; margin-bottom: 8px; }
.conflict-panel .conflict-list { max-height: 200px; overflow-y: auto; }
.conflict-panel .conflict-item {
  padding: 4px 0; border-bottom: 1px solid var(--border2);
  display: flex; align-items: center; gap: 8px;
}
.conflict-panel .conflict-item:last-child { border-bottom: none; }

.badge {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 18px; height: 18px; border-radius: 9px;
  font-size: 10px; font-weight: 700; padding: 0 5px;
}
.badge-red { background: var(--red); color: #fff; }
.badge-green { background: var(--green); color: #fff; }
.badge-amber { background: var(--amber); color: #fff; }

@media (max-width: 768px) {
  .toolbar { padding: 8px 12px; }
  .toolbar h1 { font-size: 14px; }
  .board { min-width: 1800px; }
}

// Initialize singleton state

  state.singletons.set(s.i, {

function halvesOverlap(h1, h2) {
  if (h1 === 'F' || h2 === 'F') return true;
  return h1 === h2;
}

function getStudentPeriodsForSem(studentCourses, sem) {
  const periods = {};
  for (const [code, val] of Object.entries(studentCourses)) {
    const p = val.charAt(0);
    const h = val.charAt(1);
    if (sem === 'F' || h === 'F' ||
        (sem === '1' && h === '1') ||
        (sem === '2' && h === '2')) {
      if (!periods[p]) periods[p] = [];
      periods[p].push(code);
    }
  }
  return periods;
}

function checkConflicts(sid, newPeriod, newHalves) {
  const s = state.singletons.get(sid);
  const conflicts = { teacher: [], students: [], room: [] };

  // 1. Teacher conflict: does this teacher have another section at newPeriod in overlapping semester?
  const teacherSecs = D.t[s.t] || [];
  for (const ts of teacherSecs) {
    if (ts.c === s.c) continue; // skip self
    // Check if another singleton has been moved
    let tsPeriod = ts.p;
    let tsHalves = ts.h;
    for (const [otherId, otherS] of state.singletons) {
      if (otherId !== sid && otherS.c === ts.c && otherS.t === s.t) {
        tsPeriod = otherS.currentPeriod;
        tsHalves = otherS.currentHalves;
      }
    }
    if (tsPeriod === newPeriod && halvesOverlap(tsHalves, newHalves)) {
      conflicts.teacher.push({ code: ts.c, title: ts.n, period: tsPeriod });
    }
  }

  // 2. Student conflicts: how many requesting students have a conflict at this period/sem?
  const requesters = D.r[s.c] || [];
  let canEnroll = 0;
  for (const pid of requesters) {
    const st = D.st[pid];
    if (!st) continue;
    let hasConflict = false;
    for (const [code, val] of Object.entries(st.c)) {
      if (code === s.c) continue;
      const p = val.charAt(0);
      const h = val.charAt(1);
      if (p === newPeriod && halvesOverlap(h, newHalves)) {
        hasConflict = true;
        conflicts.students.push({ pid, code, period: p });
        break;
      }
    }
    if (!hasConflict) canEnroll++;
  }

  // 3. Room conflict
  const roomKey = s.r.replace('Classroom ', '');
  const roomSlots = D.rm[roomKey] || {};
  const semsToCheck = newHalves === 'F' ? ['S1','S2'] : [newHalves === '1' ? 'S1' : 'S2'];
  for (const sem of semsToCheck) {
    const slotKey = `${newPeriod}_${sem}`;
    const occupant = roomSlots[slotKey];
    if (occupant && occupant !== s.c) {
      conflicts.room.push({ sem, code: occupant, title: codeToTitle.get(occupant) || occupant });
    }
  }

  return { conflicts, canEnroll, totalRequesters: requesters.length };
}

function getSlotKey(period, semIdx) {
  return `${period}_${semIdx}`;
}

function semLabel(h) {
  if (h === 'F') return 'FY';
  if (h === '1') return 'S1';
  return 'S2';
}

function colsForHalves(h) {
  if (h === 'F') return [0, 1, 2]; // FY, S1, S2
  if (h === '1') return [1]; // S1 only
  return [2]; // S2 only
}

function halvesFromCols(cols) {
  if (cols.length >= 2 || cols.includes(0)) return 'F';
  if (cols.includes(1)) return '1';
  return '2';
}

// ===== RENDER =====
function buildBoard() {
  const board = document.getElementById('board');
  board.innerHTML = '';

  // Row 1: Period headers
  addCell(board, 'Teacher Name', 'cell cell-header', 1, 1, 2, 1);
  addCell(board, 'Dept', 'cell cell-header', 1, 2, 2, 1);
  PERIODS.forEach((p, pi) => {
    addCell(board, `Period ${p}`, 'cell cell-header', 1, 3 + pi * 3, 1, 3);
  });

  // Row 2: FY/S1/S2 sub-headers
  PERIODS.forEach((p, pi) => {
    SEMS.forEach((sem, si) => {
      addCell(board, sem, 'cell cell-subheader', 2, 3 + pi * 3 + si, 1, 1);
    });
  });

  // Teacher rows
  const teachers = Object.keys(D.t).sort();
  let row = 3;

  teachers.forEach(teacher => {
    // Check filter
    if (!matchesFilter(teacher)) return;

    const secs = D.t[teacher];
    const teacherCell = addCell(board, '', 'cell cell-teacher', row, 1, 1, 1);
    teacherCell.textContent = teacher;

    const dept = getDeptForTeacher(teacher);
    addCell(board, dept, 'cell cell-dept', row, 2, 1, 1);

    // Period slots
    PERIODS.forEach((period, pi) => {
      SEMS.forEach((sem, si) => {
        const slotEl = addCell(board, '', 'cell cell-slot', row, 3 + pi * 3 + si, 1, 1);
        slotEl.dataset.teacher = teacher;
        slotEl.dataset.period = period;
        slotEl.dataset.sem = sem;
        slotEl.dataset.semIdx = si;

        // Find what goes in this slot
        const cardsHere = getCardsForSlot(teacher, period, sem, si);
        cardsHere.forEach(card => {
          const cardEl = createCard(card);
          slotEl.appendChild(cardEl);
          // FY cards span across all 3 semester columns
          if (card.type === 'singleton' && card.data.currentHalves === 'F') {
            cardEl.style.position = 'absolute';
            cardEl.style.left = '0';
            cardEl.style.top = '1px';
            cardEl.style.bottom = '1px';
            cardEl.style.width = 'calc(300% + 2px)';
            cardEl.style.zIndex = '5';
          }
          if (card.type === 'regular' && card.data.h === 'F') {
            cardEl.style.position = 'absolute';
            cardEl.style.left = '0';
            cardEl.style.top = '1px';
            cardEl.style.bottom = '1px';
            cardEl.style.width = 'calc(300% + 2px)';
            cardEl.style.zIndex = '4';
          }
        });

        // Drop target events
        slotEl.addEventListener('dragover', handleDragOver);
        slotEl.addEventListener('dragleave', handleDragLeave);
        slotEl.addEventListener('drop', handleDrop);
      });
    });

    row++;
  });
}

function addCell(parent, text, cls, gridRow, gridCol, rowSpan, colSpan) {
  const el = document.createElement('div');
  el.className = cls;
  if (text) el.textContent = text;
  el.style.gridRow = rowSpan > 1 ? `${gridRow} / span ${rowSpan}` : gridRow;
  el.style.gridColumn = colSpan > 1 ? `${gridCol} / span ${colSpan}` : gridCol;
  parent.appendChild(el);
  return el;
}

function getCardsForSlot(teacher, period, sem, semIdx) {
  const cards = [];

  // Check singletons assigned to this teacher at this slot
  for (const [sid, s] of state.singletons) {
    if (s.t !== teacher) continue;
    if (s.currentPeriod !== period) continue;
    const sCols = colsForHalves(s.currentHalves);
    if (!sCols.includes(semIdx)) continue;

    // For FY courses, only render in FY column (semIdx 0)
    if (s.currentHalves === 'F' && semIdx !== 0) continue;

    cards.push({ type: 'singleton', sid, data: s });
  }

  // Check regular (non-singleton) sections for this teacher at this slot
  const teacherSecs = D.t[teacher] || [];
  for (const ts of teacherSecs) {
    if (ts.s) continue; // skip singletons (handled above)
    // Check if period matches
    let tsPeriod = ts.p;
    if (tsPeriod !== period) continue;

    const tsHalves = ts.h;
    const tsCols = colsForHalves(tsHalves);
    if (!tsCols.includes(semIdx)) continue;
    if (tsHalves === 'F' && semIdx !== 0) continue;
    if (tsHalves === '1' && semIdx === 2) continue;
    if (tsHalves === '2' && semIdx === 1) continue;

    cards.push({ type: 'regular', data: ts });
  }

  return cards;
}

function createCard(card) {
  const el = document.createElement('div');

  if (card.type === 'singleton') {
    const s = card.data;
    const sid = card.sid;
    const isMoved = s.currentPeriod !== s.origPeriod || s.currentHalves !== s.origHalves;
    const isLocked = state.locked.has(sid);
    const result = checkConflicts(sid, s.currentPeriod, s.currentHalves);
    const hasConflicts = result.conflicts.teacher.length > 0 || result.conflicts.room.length > 0;
    const noConflicts = !hasConflicts;

    s.conflicts = result.conflicts;
    s.enrollment = result.canEnroll;

    let cls = 'course-card singleton';
    if (isLocked) cls += ' locked';
    else if (isMoved && noConflicts) cls += ' green';

    el.className = cls;
    el.dataset.sid = sid;

    el.innerHTML = `
      <span class="code">${s.c}</span>
      <span class="title">${truncate(s.n, 22)}</span>
      <span class="teacher-name">${s.t.split(',')[0]}</span>
      <span class="enroll">${result.canEnroll}/${result.totalRequesters}</span>
    `;

    if (!isLocked) {
      el.draggable = true;
      el.addEventListener('dragstart', handleDragStart);
      el.addEventListener('dragend', handleDragEnd);
    }

    el.addEventListener('click', (e) => {
      e.stopPropagation();
      showPopover(sid);
    });

  } else {
    const ts = card.data;
    el.className = 'course-card regular';
    el.innerHTML = `
      <span class="code">${ts.c}</span>
      <span class="title">${truncate(ts.n, 20)}</span>
    `;
  }

  return el;
}

function truncate(str, len) {
  return str.length > len ? str.slice(0, len - 1) + '…' : str;
}

function getDeptForTeacher(teacher) {
  for (const s of D.s) {
    if (s.t === teacher) return s.d;
  }
  const secs = D.t[teacher] || [];
  return secs.length > 0 ? '' : '';
}

let dragSid = null;
let ghostEl = null;

function handleDragStart(e) {
  const sid = parseInt(e.target.dataset.sid);
  if (state.locked.has(sid)) { e.preventDefault(); return; }
  dragSid = sid;
  const s = state.singletons.get(sid);

  e.target.classList.add('dragging');

  // Create ghost
  ghostEl = document.createElement('div');
  ghostEl.className = 'ghost-card';
  ghostEl.innerHTML = `${s.c}<br>${truncate(s.n, 18)}`;
  document.body.appendChild(ghostEl);

  // Hide default drag image
  const blank = document.createElement('canvas');
  blank.width = 1; blank.height = 1;
  e.dataTransfer.setDragImage(blank, 0, 0);
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', sid.toString());

  document.addEventListener('dragover', moveGhost);
}

function moveGhost(e) {
  if (ghostEl) {
    ghostEl.style.left = e.clientX + 'px';
    ghostEl.style.top = e.clientY + 'px';
  }
}

function handleDragEnd(e) {
  e.target.classList.remove('dragging');
  if (ghostEl) { ghostEl.remove(); ghostEl = null; }
  document.removeEventListener('dragover', moveGhost);
  dragSid = null;

  document.querySelectorAll('.drop-target, .drop-invalid').forEach(el => {
    el.classList.remove('drop-target', 'drop-invalid');
  });
}

function handleDragOver(e) {

    slot.classList.remove('drop-target');
    e.dataTransfer.dropEffect = 'none';
    return;
  }

  const semIdx = parseInt(slot.dataset.semIdx);

  // Preserve original semester designation — S1 stays S1, S2 stays S2, FY stays FY
  const newHalves = s.origHalves;

  const result = checkConflicts(dragSid, newPeriod, newHalves);
  const hasConflicts = result.conflicts.teacher.length > 0 || result.conflicts.room.length > 0;

  if (hasConflicts) {
    slot.classList.add('drop-invalid');
    slot.classList.remove('drop-target');
  } else {
    slot.classList.add('drop-target');
    slot.classList.remove('drop-invalid');
  }

  e.dataTransfer.dropEffect = 'move';

  // Update ghost color
  if (ghostEl) {
    ghostEl.style.background = hasConflicts ? 'var(--red-cell)' : 'var(--green-cell)';
  }
}

function handleDragLeave(e) {
  e.currentTarget.classList.remove('drop-target', 'drop-invalid');
}

function handleDrop(e) {
  e.preventDefault();
  const slot = e.currentTarget;
  slot.classList.remove('drop-target', 'drop-invalid');

  if (!dragSid) return;
  const s = state.singletons.get(dragSid);
  if (!s || slot.dataset.teacher !== s.t) return;

  const newPeriod = slot.dataset.period;
  const semIdx = parseInt(slot.dataset.semIdx);

  // Preserve original semester designation — S1 stays S1, S2 stays S2, FY stays FY
  const newHalves = s.origHalves;

  // Apply the move
  s.currentPeriod = newPeriod;
  s.currentHalves = newHalves;

  state.moves.set(dragSid, {
    from: { period: s.origPeriod, halves: s.origHalves },
    to: { period: newPeriod, halves: newHalves }
  });

  buildBoard();
  updateStats();
  updateButtons();

  const result = checkConflicts(dragSid, newPeriod, newHalves);
  const hasConflicts = result.conflicts.teacher.length > 0 || result.conflicts.room.length > 0;
  showToast(
    hasConflicts
      ? `${s.c} moved to Period ${newPeriod} — has conflicts!`
      : `${s.c} moved to Period ${newPeriod} — conflict-free (${result.canEnroll} students can enroll)`,
    hasConflicts ? 'error' : 'success'
  );
}

// ===== POPOVER =====
function showPopover(sid) {
  const s = state.singletons.get(sid);
  const result = checkConflicts(sid, s.currentPeriod, s.currentHalves);
  const isLocked = state.locked.has(sid);
  const isMoved = s.currentPeriod !== s.origPeriod || s.currentHalves !== s.origHalves;

  const pop = document.getElementById('popover');

  // Teacher schedule
  const teacherSecs = D.t[s.t] || [];
  let teacherHtml = '<table><tr><th>Code</th><th>Course</th><th>Period</th><th>Term</th><th>Room</th></tr>';
  teacherSecs.forEach(ts => {
    let p = ts.p, h = ts.h;
    // If this is another singleton that has been moved, show current position
    for (const [otherId, otherS] of state.singletons) {
      if (otherS.c === ts.c && otherS.t === s.t) {
        p = otherS.currentPeriod;
        h = otherS.currentHalves;
      }
    }
    const isSelf = ts.c === s.c;
    const style = isSelf ? 'font-weight:700;background:var(--amber-bg);' : '';
    teacherHtml += `<tr style="${style}"><td>${ts.c}</td><td>${ts.n}</td><td>${p}</td><td>${semLabel(h)}</td><td>${ts.r || ''}</td></tr>`;
  });
  teacherHtml += '</table>';

  // Student requesters with conflicts
  const requesters = D.r[s.c] || [];
  let studentsHtml = `<p style="margin-bottom:6px;">${result.canEnroll} of ${result.totalRequesters} students can take this at Period ${s.currentPeriod} (${semLabel(s.currentHalves)})</p>`;
  studentsHtml += `<div style="max-height:200px;overflow-y:auto;"><table><tr><th>Student</th><th>Grade</th><th>Conflict</th><th>At Period ${s.currentPeriod}</th></tr>`;

  const conflictPids = new Set(result.conflicts.students.map(c => c.pid));
  requesters.forEach(pid => {
    const st = D.st[pid];
    if (!st) return;
    const hasConf = conflictPids.has(pid);
    let confCourse = '';
    if (hasConf) {
      const c = result.conflicts.students.find(x => x.pid === pid);
      confCourse = c ? `${c.code} (${codeToTitle.get(c.code) || c.code})` : '';
    }
    studentsHtml += `<tr><td>${pid}</td><td>${st.g}</td><td><span class="conflict-tag ${hasConf ? 'yes' : 'no'}">${hasConf ? 'Yes' : 'OK'}</span></td><td>${confCourse}</td></tr>`;
  });
  studentsHtml += '</table></div>';

  // Room info
  const roomKey = s.r.replace('Classroom ', '');
  const roomSlots = D.rm[roomKey] || {};
  let roomHtml = `<p style="margin-bottom:6px;">Room: <strong>${s.r}</strong></p><table><tr><th>Period</th><th>S1</th><th>S2</th></tr>`;
  PERIODS.forEach(p => {
    const s1 = roomSlots[`${p}_S1`] || '';
    const s2 = roomSlots[`${p}_S2`] || '';
    const isTarget = p === s.currentPeriod;
    const style = isTarget ? 'background:var(--amber-bg);font-weight:700;' : '';
    roomHtml += `<tr style="${style}"><td>${p}</td><td>${s1}</td><td>${s2}</td></tr>`;
  });
  roomHtml += '</table>';

  // Room conflicts
  if (result.conflicts.room.length > 0) {
    roomHtml += '<p style="color:var(--red);font-weight:600;margin-top:6px;">Room conflict: ';
    roomHtml += result.conflicts.room.map(c => `${c.code} (${c.title || ''}) in ${c.sem}`).join(', ');
    roomHtml += '</p>';
  }

  // Teacher conflicts
  let teacherConflictHtml = '';
  if (result.conflicts.teacher.length > 0) {
    teacherConflictHtml = `<div class="pop-section"><h4>Teacher Conflicts</h4><p style="color:var(--red);font-weight:600;">`;
    teacherConflictHtml += result.conflicts.teacher.map(c => `${c.code} ${c.title} at Period ${c.period}`).join(', ');
    teacherConflictHtml += '</p></div>';
  }

  // Period analysis: show conflicts at each period
  let periodAnalysisHtml = '<table><tr><th>Period</th><th>Teacher</th><th>Room</th><th>Students OK</th></tr>';
  PERIODS.forEach(p => {
    const test = checkConflicts(sid, p, s.currentHalves);
    const tConf = test.conflicts.teacher.length > 0 ? 'Conflict' : 'Free';
    const rConf = test.conflicts.room.length > 0 ? 'Conflict' : 'Free';
    const tStyle = tConf === 'Conflict' ? 'color:var(--red);font-weight:600;' : 'color:var(--green);';
    const rStyle = rConf === 'Conflict' ? 'color:var(--red);font-weight:600;' : 'color:var(--green);';
    const isCurrent = p === s.currentPeriod;
    const rowStyle = isCurrent ? 'background:var(--amber-bg);' : '';
    periodAnalysisHtml += `<tr style="${rowStyle}"><td>${p}${isCurrent ? ' (current)' : ''}</td><td style="${tStyle}">${tConf}</td><td style="${rStyle}">${rConf}</td><td>${test.canEnroll}/${test.totalRequesters}</td></tr>`;
  });
  periodAnalysisHtml += '</table>';

  const hasConflicts = result.conflicts.teacher.length > 0 || result.conflicts.room.length > 0;

  pop.innerHTML = `
    <div class="pop-header">
      <h3>${s.c} — ${s.n}</h3>
      <button class="pop-close" id="pop-close">&times;</button>
    </div>
    <div class="pop-body">
      <div style="display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap;">
        <span><strong>Period:</strong> ${s.currentPeriod} (${semLabel(s.currentHalves)})</span>
        <span><strong>Teacher:</strong> ${s.t}</span>
        <span><strong>Room:</strong> ${s.r}</span>
        <span><strong>Cap:</strong> ${s.k}</span>
        <span><strong>Enrolled:</strong> ${result.canEnroll}/${result.totalRequesters}</span>
        ${isMoved ? `<span style="color:var(--amber);font-weight:600;">Moved from ${s.origPeriod}</span>` : ''}
        ${isLocked ? '<span style="color:var(--green);font-weight:600;">LOCKED</span>' : ''}
        ${hasConflicts ? '<span style="color:var(--red);font-weight:600;">HAS CONFLICTS</span>' : '<span style="color:var(--green);font-weight:600;">NO CONFLICTS</span>'}
      </div>

      ${teacherConflictHtml}

      <div class="pop-section">
        <h4>Period Analysis</h4>
        ${periodAnalysisHtml}
      </div>

      <div class="pop-section">
        <h4>Teacher Schedule — ${s.t}</h4>
        ${teacherHtml}
      </div>

      <div class="pop-section">
        <h4>Student Requesters</h4>
        ${studentsHtml}
      </div>

      <div class="pop-section">
        <h4>Room Schedule</h4>
        ${roomHtml}
      </div>

      <div class="pop-actions">
        ${!isLocked && isMoved && !hasConflicts ? `<button class="btn btn-commit" onclick="lockSingleton(${sid})">Lock Position</button>` : ''}
        ${!isLocked && isMoved ? `<button class="btn btn-reset" onclick="resetSingleton(${sid})">Reset to Original</button>` : ''}
        ${isLocked ? `<button class="btn btn-reset" onclick="unlockSingleton(${sid})">Unlock</button>` : ''}
      </div>
    </div>
  `;

  document.getElementById('popover-overlay').classList.add('active');

  // Center popover
  pop.style.top = '50%';
  pop.style.left = '50%';
  pop.style.transform = 'translate(-50%, -50%)';

  document.getElementById('pop-close').onclick = closePopover;
  document.getElementById('popover-overlay').onclick = (e) => {
    if (e.target === document.getElementById('popover-overlay')) closePopover();
  };
}

function closePopover() {
  document.getElementById('popover-overlay').classList.remove('active');
}

// ===== ACTIONS =====
function lockSingleton(sid) {
  state.locked.add(sid);
  closePopover();
  buildBoard();
  updateStats();
  updateButtons();
  showToast(`Section locked at Period ${state.singletons.get(sid).currentPeriod}`, 'success');
}

function unlockSingleton(sid) {
  state.locked.delete(sid);
  closePopover();
  buildBoard();
  updateStats();
  updateButtons();
  showToast('Section unlocked', 'info');
}

function resetSingleton(sid) {
  const s = state.singletons.get(sid);
  s.currentPeriod = s.origPeriod;
  s.currentHalves = s.origHalves;
  state.moves.delete(sid);
  state.locked.delete(sid);
  closePopover();
  buildBoard();
  updateStats();
  updateButtons();
  showToast(`${s.c} reset to original Period ${s.origPeriod}`, 'info');
}

function updateStats() {
  let moved = 0, green = 0, locked = 0, conflicts = 0;
  for (const [sid, s] of state.singletons) {
    const isMoved = s.currentPeriod !== s.origPeriod || s.currentHalves !== s.origHalves;
    if (isMoved) moved++;
    const result = checkConflicts(sid, s.currentPeriod, s.currentHalves);
    const hasConflicts = result.conflicts.teacher.length > 0 || result.conflicts.room.length > 0;
    if (isMoved && !hasConflicts) green++;
    if (state.locked.has(sid)) locked++;
    if (hasConflicts) conflicts++;
  }
  document.getElementById('stat-moved').textContent = moved;
  document.getElementById('stat-green').textContent = green;
  document.getElementById('stat-locked').textContent = locked;
  document.getElementById('stat-conflicts').textContent = conflicts;
}

function updateButtons() {
  const hasMoves = state.moves.size > 0;
  const hasLocked = state.locked.size > 0;
  document.getElementById('btn-save').disabled = !hasMoves;
  document.getElementById('btn-commit').disabled = !hasLocked;
  document.getElementById('btn-reset').disabled = !hasMoves && !hasLocked;
}

// ===== SAVE / COMMIT / EXPORT =====
document.getElementById('btn-save').onclick = () => {
  state.saved = {};
  for (const [sid, s] of state.singletons) {
    if (state.moves.has(sid)) {
      state.saved[sid] = {
        code: s.c,
        title: s.n,
        teacher: s.t,
        from: { period: s.origPeriod, halves: semLabel(s.origHalves) },
        to: { period: s.currentPeriod, halves: semLabel(s.currentHalves) },
        locked: state.locked.has(sid),
        enrollment: s.enrollment
      };
    }
  }
  showToast(`Saved ${Object.keys(state.saved).length} changes`, 'success');
};

document.getElementById('btn-commit').onclick = () => {
  const committed = [];
  for (const [sid, s] of state.singletons) {
    if (state.locked.has(sid)) {
      const result = checkConflicts(sid, s.currentPeriod, s.currentHalves);
      committed.push({
        sid: s.i,
        code: s.c,
        title: s.n,
        teacher: s.t,
        room: s.r,
        from: { period: s.origPeriod, halves: semLabel(s.origHalves) },
        to: { period: s.currentPeriod, halves: semLabel(s.currentHalves) },
        enrollment: result.canEnroll,
        totalRequesters: result.totalRequesters
      });
    }
  }
  state.committed = committed;
  showToast(`Committed ${committed.length} locked changes — use Export to download`, 'success');
  document.getElementById('btn-export').classList.add('btn-commit');
};

document.getElementById('btn-reset').onclick = () => {
  if (!confirm('Reset all moves and locks?')) return;
  for (const [sid, s] of state.singletons) {
    s.currentPeriod = s.origPeriod;
    s.currentHalves = s.origHalves;
  }
  state.moves.clear();
  state.locked.clear();
  state.saved = null;
  state.committed = null;
  buildBoard();
  updateStats();
  updateButtons();
  showToast('All changes reset', 'info');
};

document.getElementById('btn-export').onclick = () => {
  const exportData = {
    exported: new Date().toISOString(),
    type: state.committed ? 'committed' : 'draft',
    changes: []
  };

  if (state.committed) {
    exportData.changes = state.committed;
  } else {
    for (const [sid, s] of state.singletons) {
      if (state.moves.has(sid)) {
        const result = checkConflicts(sid, s.currentPeriod, s.currentHalves);
        exportData.changes.push({
          sid: s.i,
          code: s.c,
          title: s.n,
          teacher: s.t,
          room: s.r,
          from: { period: s.origPeriod, halves: semLabel(s.origHalves) },
          to: { period: s.currentPeriod, halves: semLabel(s.currentHalves) },
          locked: state.locked.has(sid),
          conflicts: {
            teacher: result.conflicts.teacher.length,
            room: result.conflicts.room.length,
            students: result.conflicts.students.length
          },
          enrollment: result.canEnroll,
          totalRequesters: result.totalRequesters
        });
      }
    }
  }

  if (exportData.changes.length === 0) {
    showToast('No changes to export', 'error');
    return;
  }

  const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `singleton_changes_${exportData.type}_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast(`Exported ${exportData.changes.length} changes`, 'success');
};

// ===== FILTER =====
function matchesFilter(teacher) {
  const dept = document.getElementById('filter-dept').value;
  const status = document.getElementById('filter-status').value;
  const search = document.getElementById('filter-search').value.toLowerCase();

  if (search) {
    const teacherMatch = teacher.toLowerCase().includes(search);
    const courseMatch = (D.t[teacher] || []).some(s =>
      s.c.toLowerCase().includes(search) || s.n.toLowerCase().includes(search)
    );
    if (!teacherMatch && !courseMatch) return false;
  }

  if (dept) {
    const teacherDept = getDeptForTeacher(teacher);
    if (teacherDept !== dept) return false;
  }

  if (status) {
    const teacherSingletons = [];
    for (const [sid, s] of state.singletons) {
      if (s.t === teacher) teacherSingletons.push(sid);
    }
    if (teacherSingletons.length === 0) return false;

    switch (status) {
      case 'moved': return teacherSingletons.some(sid => state.moves.has(sid));
      case 'green': return teacherSingletons.some(sid => {
        const s = state.singletons.get(sid);
        const isMoved = s.currentPeriod !== s.origPeriod;
        const result = checkConflicts(sid, s.currentPeriod, s.currentHalves);
        return isMoved && result.conflicts.teacher.length === 0 && result.conflicts.room.length === 0;
      });
      case 'locked': return teacherSingletons.some(sid => state.locked.has(sid));
      case 'unmoved': return teacherSingletons.some(sid => !state.moves.has(sid));
    }
  }

  return true;
}

document.getElementById('filter-dept').onchange = () => { buildBoard(); };
document.getElementById('filter-status').onchange = () => { buildBoard(); };
document.getElementById('filter-search').oninput = () => { buildBoard(); };

// Populate department filter
function populateDepts() {
  const depts = new Set();
  D.s.forEach(s => { if (s.d) depts.add(s.d); });
  const sel = document.getElementById('filter-dept');
  [...depts].sort().forEach(d => {
    const opt = document.createElement('option');
    opt.value = d; opt.textContent = d;
    sel.appendChild(opt);
  });
}

// ===== TOAST =====
function showToast(msg, type) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = `toast ${type} show`;
  setTimeout(() => { toast.classList.remove('show'); }, 3000);
}

// ===== ZOOM =====
let zoomLevel = 100;
const ZOOM_STEPS = [50, 60, 70, 80, 90, 100];

function applyZoom(level) {
  zoomLevel = level;
  const board = document.querySelector('.board');
  const wrap = document.querySelector('.board-wrap');
  const scale = level / 100;
  board.style.transform = `scale(${scale})`;
  board.style.transformOrigin = 'top left';
  board.style.width = (100 / scale) + '%';
  document.getElementById('zoom-label').textContent = level + '%';
}

document.getElementById('zoom-out').onclick = () => {
  const idx = ZOOM_STEPS.indexOf(zoomLevel);
  if (idx > 0) applyZoom(ZOOM_STEPS[idx - 1]);
  else if (idx === -1 && zoomLevel > ZOOM_STEPS[0]) {
    const nearest = ZOOM_STEPS.filter(s => s < zoomLevel).pop();
    if (nearest) applyZoom(nearest);
  }
};

document.getElementById('zoom-in').onclick = () => {
  const idx = ZOOM_STEPS.indexOf(zoomLevel);
  if (idx < ZOOM_STEPS.length - 1) applyZoom(ZOOM_STEPS[idx + 1]);
  else if (idx === -1 && zoomLevel < ZOOM_STEPS[ZOOM_STEPS.length - 1]) {
    const nearest = ZOOM_STEPS.find(s => s > zoomLevel);
    if (nearest) applyZoom(nearest);
  }
};

document.getElementById('zoom-fit').onclick = () => {
  const wrap = document.querySelector('.board-wrap');
  const board = document.querySelector('.board');
  board.style.transform = 'none';
  board.style.width = '';
  const viewW = wrap.clientWidth;
  const boardW = board.scrollWidth;
  const fitPct = Math.max(50, Math.min(100, Math.floor((viewW / boardW) * 100)));
  const snapped = ZOOM_STEPS.reduce((prev, curr) => Math.abs(curr - fitPct) < Math.abs(prev - fitPct) ? curr : prev);
  applyZoom(snapped);
};

// ===== INIT =====
populateDepts();
buildBoard();
updateStats();
</script>
