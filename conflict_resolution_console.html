const BY_PERIOD = {"A":24,"B":26,"C":38,"D":37,"E":21,"F":20,"G":43};

const approved = new Map();

function init() {
  renderStats();
  renderTabs();
  renderPanels();
  updateDock();
}

function renderStats() {
  const bar = document.getElementById('statsBar');
  bar.innerHTML = `
    <div class="stat-chip red"><span class="num">209</span> Unresolved Conflicts</div>
    <div class="stat-chip green"><span class="num">96.8%</span> Placement Rate</div>
    <div class="stat-chip blue"><span class="num">6,303</span> / 6,512 Placed</div>
    <div class="stat-chip orange"><span class="num">182</span> Students Affected</div>
  `;
}

const tabDefs = [
  {id:'high', label:'High Impact', filter: d => d.clashes >= 5},
  {id:'med', label:'Medium', filter: d => d.clashes >= 3 && d.clashes < 5},
  {id:'low', label:'Low', filter: d => d.clashes < 3},
  {id:'period', label:'By Period'},
  {id:'approved', label:'Approved'},
  {id:'all', label:'All Courses'},
];

function renderTabs() {
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = tabDefs.map((t,i) => {
    let count = '';
    if (t.filter) count = DATA.filter(t.filter).length;
    else if (t.id === 'approved') count = approved.size;
    else if (t.id === 'all') count = DATA.length;
    else count = '';
    const badge = count !== '' ? `<span class="badge">${count}</span>` : '';
    return `<button class="tab${i===0?' active':''}" role="tab" data-tab="${t.id}" onclick="switchTab('${t.id}')">${t.label}${badge}</button>`;
  }).join('');
}

function switchTab(id) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === id));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-'+id));
}

function renderPanels() {
  const panels = document.getElementById('panels');
  panels.innerHTML = '';

  // High, Med, Low panels
  for (const t of tabDefs.filter(t => t.filter)) {
    const items = DATA.filter(t.filter);
    const div = document.createElement('div');
    div.className = `panel${t.id === 'high' ? ' active' : ''}`;
    div.id = 'panel-' + t.id;
    div.innerHTML = items.map(d => renderCard(d)).join('');
    panels.appendChild(div);
  }

  // Period panel
  const periodPanel = document.createElement('div');
  periodPanel.className = 'panel';
  periodPanel.id = 'panel-period';
  periodPanel.innerHTML = renderPeriodChart();
  panels.appendChild(periodPanel);

  // Approved panel
  const appPanel = document.createElement('div');
  appPanel.className = 'panel';
  appPanel.id = 'panel-approved';
  appPanel.innerHTML = '<p style="color:var(--text3);padding:20px;">No approved changes yet.</p>';
  panels.appendChild(appPanel);

  // All table
  const allPanel = document.createElement('div');
  allPanel.className = 'panel';
  allPanel.id = 'panel-all';
  allPanel.innerHTML = renderAllTable();
  panels.appendChild(allPanel);
}

function renderCard(d) {
  const severity = d.clashes >= 7 ? 'high' : d.clashes >= 4 ? 'med' : 'low';
  const isApproved = approved.has(d.code);
  const periods = 'ABCDEFG'.split('');
  const covered = new Set(d.periods);
  const gapSet = new Set(d.gaps);

  const periodDots = periods.map(p => {
    if (covered.has(p)) return `<span class="period-dot filled">${p}</span>`;
    if (gapSet.has(p)) return `<span class="period-dot gap">${p}</span>`;
    return `<span class="period-dot na">${p}</span>`;
  }).join('');

  const teacherInfo = Object.entries(d.teacher_free).map(([name, info]) => {
    const freeAll = info.free_s1.filter(p => info.free_s2.includes(p));
    const freeS1only = info.free_s1.filter(p => !info.free_s2.includes(p));
    const freeS2only = info.free_s2.filter(p => !info.free_s1.includes(p));
    let parts = [];
    if (freeAll.length) parts.push(`Both: ${freeAll.join(', ')}`);
    if (freeS1only.length) parts.push(`S1 only: ${freeS1only.join(', ')}`);
    if (freeS2only.length) parts.push(`S2 only: ${freeS2only.join(', ')}`);
    return `<strong>${name}</strong> (${info.load_s1}/${info.load_s2} sections S1/S2)<br>Free: ${parts.join(' | ') || 'None'}`;
  }).join('<br>');

  const blockingHtml = Object.entries(d.blocking).map(([k,v]) =>
    `<div class="blocking-item"><span>${k}</span><span class="blocking-count">${v}x</span></div>`
  ).join('');

  const actionClass = d.fix_type === 'structural' ? 'structural' : '';

  return `
  <div class="card${isApproved ? ' approved-card' : ''}" id="card-${d.code}" data-code="${d.code}">
    <div class="card-header" onclick="toggleCard('${d.code}')">
      <div class="card-left">
        <span class="clash-count ${severity}">${d.clashes}</span>
        <span class="card-code">${d.code}</span>
        <span class="card-title">${d.title}</span>
        <span class="dept-badge">${d.dept}</span>
      </div>
      ${isApproved ? '<span style="color:var(--green);font-weight:700;font-size:13px;">APPROVED</span>' : ''}
    </div>
    <div class="card-body">
      <div class="info-grid">
        <div class="info-box">
          <div class="info-label">Sections & Periods</div>
          <div class="info-value">${d.sections} section${d.sections>1?'s':''} — ${d.gaps.length ? d.gaps.length + ' period gap' + (d.gaps.length>1?'s':'') : 'all periods covered'}</div>
          <div class="period-dots">${periodDots}</div>
        </div>
        <div class="info-box">
          <div class="info-label">Teacher Availability</div>
          <div class="info-value" style="font-size:12px">${teacherInfo}</div>
        </div>
      </div>
      ${blockingHtml ? `<div class="info-box" style="margin-bottom:14px"><div class="info-label">Blocked By (what course kept the student)</div><div class="blocking-list">${blockingHtml}</div></div>` : ''}
      <div class="action-box ${actionClass}">
        <div class="action-title">${d.fix_type === 'structural' ? 'Structural Issue' : 'Recommended Action'}</div>
        <div class="action-text">${d.fix_desc}</div>
      </div>
      ${d.fix_type !== 'structural' ? `
        <div style="margin-top:12px">
          ${isApproved ?
            `<button class="approve-btn approved" onclick="unapprove('${d.code}')">Approved — Click to Undo</button>` :
            `<button class="approve-btn primary" onclick="approve('${d.code}')">Approve Recommendation</button>`
          }
        </div>
      ` : ''}
    </div>
  </div>`;
}

function renderPeriodChart() {
  const maxVal = Math.max(...Object.values(BY_PERIOD));
  const colors = {A:'#3b82f6',B:'#8b5cf6',C:'#ef4444',D:'#f59e0b',E:'#10b981',F:'#06b6d4',G:'#dc2626'};
  const bars = 'ABCDEFG'.split('').map(p => {
    const val = BY_PERIOD[p] || 0;
    const h = Math.max(4, (val / maxVal) * 80);
    const color = val >= 40 ? 'var(--red)' : val >= 30 ? 'var(--orange)' : 'var(--green)';
    return `<div class="period-bar-wrap">
      <div class="period-bar-count">${val}</div>
      <div class="period-bar" style="height:${h}px;background:${color}"></div>
      <div class="period-bar-label">${p}</div>
    </div>`;
  }).join('');

  return `<div class="card" style="padding:20px">
    <h3 style="font-size:15px;margin-bottom:4px">Clashes by Period</h3>
    <p style="font-size:12px;color:var(--text3);margin-bottom:12px">Period G (43) and C (38) are the most congested. E (21) and F (20) have the most room.</p>
    <div class="period-chart">${bars}</div>
    <div style="margin-top:16px">
      <h4 style="font-size:13px;margin-bottom:8px">Key Period Issues</h4>
      <ul style="font-size:13px;color:var(--text2);padding-left:18px;line-height:1.8">
        <li><strong>Period G (43 clashes):</strong> AP Macro/Micro (pinned), AP Psychology, Robotics Design, Bloomberg Market Concepts</li>
        <li><strong>Period C (38 clashes):</strong> Robotics Project, AP Eng Lit sec#2, Business Law, Physics</li>
        <li><strong>Period D (37 clashes):</strong> Sociology (single section), Adv Drawing, Business Law</li>
        <li><strong>Periods E & F (21/20):</strong> Least congested — best targets for new sections</li>
      </ul>
    </div>
  </div>`;
}

function renderAllTable() {
  const rows = DATA.map(d => {
    const severity = d.clashes >= 7 ? 'high' : d.clashes >= 4 ? 'med' : 'low';
    return `<tr>
      <td><span class="clash-count ${severity}" style="width:24px;height:24px;font-size:11px;border-radius:12px">${d.clashes}</span></td>
      <td class="mono">${d.code}</td>
      <td>${d.title}</td>
      <td><span class="dept-badge">${d.dept}</span></td>
      <td class="mono">${d.sections}</td>
      <td>${d.gaps.length ? d.gaps.join(', ') : '—'}</td>
      <td style="font-size:12px">${d.fix_type === 'structural' ? '<em>Structural</em>' : d.fix_desc.split('.')[0]}</td>
    </tr>`;
  }).join('');

  return `<div style="overflow-x:auto"><table class="summary-table">
    <thead><tr>
      <th>#</th><th>Code</th><th>Course</th><th>Dept</th><th>Sec</th><th>Gaps</th><th>Fix</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

function toggleCard(code) {
  const card = document.getElementById('card-' + code);
  card.classList.toggle('open');
}

function approve(code) {
  const d = DATA.find(x => x.code === code);
  if (d) {
    approved.set(code, d);
    rerenderAll();
  }
}

function unapprove(code) {
  approved.delete(code);
  rerenderAll();
}

function approveAllHigh() {
  DATA.filter(d => d.clashes >= 5 && d.fix_type !== 'structural').forEach(d => approved.set(d.code, d));
  rerenderAll();
}

function clearAll() {
  approved.clear();
  rerenderAll();
}

function rerenderAll() {
  renderTabs();
  renderPanels();
  updateDock();
  const activeTab = document.querySelector('.tab.active');
  if (activeTab) switchTab(activeTab.dataset.tab);
  renderApproved();
}

function renderApproved() {
  const panel = document.getElementById('panel-approved');
  if (approved.size === 0) {
    panel.innerHTML = '<p style="color:var(--text3);padding:20px;">No approved changes yet. Approve recommendations from the High Impact or Medium tabs.</p>';
    return;
  }
  const items = Array.from(approved.values()).sort((a,b) => b.clashes - a.clashes);
  panel.innerHTML = items.map(d => renderCard(d)).join('');
}

function updateDock() {
  const actionable = DATA.filter(d => d.fix_type !== 'structural').length;
  document.getElementById('totalActionable').textContent = actionable;
  document.getElementById('approvedCount').textContent = approved.size;
  const est = Array.from(approved.values()).reduce((s, d) => s + d.clashes, 0);
  document.getElementById('estResolved').textContent = est;
}

function showExport() {
  if (approved.size === 0) {
    alert('No changes approved yet.');
    return;
  }
  const lines = ['DON BOSCO PREP 2026-27 — APPROVED SCHEDULE CHANGES', '=' .repeat(55), ''];
  const items = Array.from(approved.values()).sort((a,b) => b.clashes - a.clashes);
  let totalEst = 0;
  for (const d of items) {
    totalEst += d.clashes;
    lines.push(`[${d.code}] ${d.title} (${d.dept})`);
    lines.push(`  Current: ${d.sections} section(s) in period(s) ${[...new Set(d.periods)].join(', ')}`);
    lines.push(`  Action: ${d.fix_desc}`);
    lines.push(`  Est. clashes resolved: ${d.clashes}`);
    lines.push('');
  }
  lines.push('—'.repeat(55));
  lines.push(`TOTAL APPROVED: ${approved.size} changes`);
  lines.push(`EST. CLASHES RESOLVED: up to ${totalEst} of 209`);
  lines.push(`REMAINING EST.: ~${209 - totalEst} clashes`);
  lines.push('');
  lines.push('NOTE: Estimates assume added sections absorb all affected students.');
  lines.push('Actual results depend on re-running the scheduling engine after changes.');

  document.getElementById('exportText').textContent = lines.join('\n');
  document.getElementById('exportModal').classList.add('visible');
}

function copyExport() {
  const text = document.getElementById('exportText').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelector('.modal .approve-btn.primary');
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = 'Copy to Clipboard', 2000);
  });
}

init();
</script>
